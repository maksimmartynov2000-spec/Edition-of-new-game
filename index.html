<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ася">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)">
<title>«Ася» по порядку — тезисы и вопросы</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f1e7; --glass:rgba(246,241,231,.88); --side:#efe8da;
  --card:#fffdf8; --ink:#2a2520; --muted:#7c7164; --quote:#4a4037;
  --line:#e5dccb; --line2:#d6cbb6; --chip:#ece4d4;
  --accent:#8c3b2c; --onaccent:#fff;
  --qbg:#f2e9d6; --qline:#e2d3b3;
  --ok:#2e7a4b; --okbg:#e4f1e7; --bad:#b0412f; --badbg:#f8e5df;
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  --fs: 18px; --hdr: 0px; --bar: 0px; --col: 720px;
  --sl: max(16px, env(safe-area-inset-left)); --sr: max(16px, env(safe-area-inset-right));
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191714; --glass:rgba(25,23,20,.88); --side:#1f1c18;
    --card:#24211c; --ink:#ece5d8; --muted:#a39888; --quote:#d6cbb9;
    --line:#38322a; --line2:#4a4237; --chip:#312c25;
    --accent:#e3a183; --onaccent:#1b1310;
    --qbg:#2a251e; --qline:#433a2e;
    --ok:#7fca97; --okbg:#1e3226; --bad:#f2907c; --badbg:#3b2420;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; background:var(--bg)}
body{margin:0; font-family:var(--serif); font-size:var(--fs); line-height:1.55; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
.app{min-height:100dvh}
.main{min-height:100dvh; display:flex; flex-direction:column; min-width:0}

/* ---------- верхняя панель (телефон) ---------- */
.top{position:sticky; top:0; z-index:20; background:var(--glass);
  -webkit-backdrop-filter:saturate(1.4) blur(16px); backdrop-filter:saturate(1.4) blur(16px);
  border-bottom:1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 8px) var(--sr) 0 var(--sl)}
.top-row{max-width:var(--col); margin:0 auto; display:flex; align-items:center; gap:12px; padding-bottom:9px}
.top-title{min-width:0; flex:1}
.top-title b{display:block; font-size:1.15rem; line-height:1.2}
.top-title span{display:block; font-family:var(--sans); font-size:.78rem; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top-count{font-family:var(--sans); font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums}
.btn-ch{border:0; background:var(--chip); border-radius:999px; min-height:38px; padding:0 16px;
  font-family:var(--sans); font-size:.88rem; font-weight:600; color:var(--accent)}
.track{height:3px; background:var(--line); margin:0 calc(-1 * var(--sl)) 0 calc(-1 * var(--sr))}
.fill{height:100%; width:0; background:var(--accent); transition:width .3s ease}

/* ---------- лента ---------- */
#feed{flex:1; width:100%; max-width:calc(var(--col) + 32px); margin:0 auto; padding:14px var(--sr) 28px var(--sl)}
.th,.qz,.chap,.fb,.end,.intro{scroll-margin-top:calc(var(--hdr) + 12px); scroll-margin-bottom:calc(var(--bar) + 12px)}
.intro{font-family:var(--sans); font-size:.9rem; line-height:1.5; color:var(--muted);
  border:1px dashed var(--line2); border-radius:16px; padding:12px 14px; margin:6px 0 4px}
.intro b{color:var(--ink)}
.chap{margin:30px 0 12px; text-align:center}
.chap .roman{font-family:var(--sans); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700}
.chap h2{margin:2px 0 0; font-size:1.4rem; font-weight:600; line-height:1.25}
.chap::after{content:""; display:block; width:44px; height:2px; background:var(--line2); margin:10px auto 0; border-radius:2px}

.th{position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:13px 16px 14px 52px; margin:10px 0; box-shadow:0 1px 2px rgba(0,0,0,.04)}
.th .num{position:absolute; left:13px; top:14px; width:27px; height:27px; border-radius:50%;
  display:grid; place-items:center; font-family:var(--sans); font-size:.68rem; font-weight:700;
  color:var(--muted); border:1px solid var(--line2); font-variant-numeric:tabular-nums}
.th p{margin:0}
.th blockquote{margin:9px 0 0; padding:1px 0 1px 12px; border-left:3px solid var(--accent);
  font-style:italic; color:var(--quote); font-size:.96em}

.qz{background:var(--qbg); border:1px solid var(--qline); border-radius:18px; padding:15px 15px 16px; margin:18px 0}
.qz .lab{font-family:var(--sans); font-size:.72rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--accent)}
.qz .ask{margin:5px 0 12px; font-weight:600; line-height:1.4}
.opts{display:grid; gap:10px}
.opt{appearance:none; -webkit-appearance:none; display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
  min-height:54px; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line2); background:var(--card);
  font-size:.97rem; line-height:1.42; cursor:pointer; transition:border-color .15s, background-color .15s, opacity .15s, transform .08s}
.opt:active:not([disabled]){transform:scale(.985)}
.opt .l{flex:none; width:27px; height:27px; border-radius:50%; display:grid; place-items:center; margin-top:-1px;
  font-family:var(--sans); font-size:.8rem; font-weight:700; background:var(--chip); color:var(--muted)}
.opt[disabled]{cursor:default}
.opts.done .opt:not(.ok):not(.bad){opacity:.5}
.opt.ok{border-color:var(--ok); background:var(--okbg)}
.opt.ok .l{background:var(--ok); color:var(--card)}
.opt.bad{border-color:var(--bad); background:var(--badbg)}
.opt.bad .l{background:var(--bad); color:var(--card)}
@media (hover:hover){ .opt:not([disabled]):hover{border-color:var(--accent)} }
.fb{margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); font-size:.95rem; line-height:1.5}
.fb[hidden]{display:none}
.fb .v{font-family:var(--sans); font-weight:800}
.fb .v.okt{color:var(--ok)} .fb .v.badt{color:var(--bad)}

.end{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin:28px 0 8px}
.end h3{margin:0 0 8px; font-size:1.25rem}
.end ul{margin:0; padding-left:1.1em}
.end li{margin:6px 0}

.new{animation:appear .32s ease both}
@keyframes appear{from{opacity:0; transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){ .new{animation:none} .fill{transition:none} }

/* ---------- нижняя кнопка ---------- */
.bar{position:sticky; bottom:0; z-index:15; background:var(--glass);
  -webkit-backdrop-filter:saturate(1.4) blur(16px); backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line); padding:10px var(--sr) max(12px, env(safe-area-inset-bottom)) var(--sl)}
.bar-in{max-width:var(--col); margin:0 auto; display:flex}
#next{flex:1; min-height:56px; border:0; border-radius:16px; background:var(--accent); color:var(--onaccent);
  font-family:var(--sans); font-size:1.05rem; font-weight:650; cursor:pointer; transition:background-color .15s, transform .08s}
#next:active:not(:disabled){transform:scale(.985)}
#next:disabled{background:var(--chip); color:var(--muted); cursor:default}

/* ---------- главы: шторка на телефоне ---------- */
.scrim{position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.38); opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.show{opacity:1; pointer-events:auto}
.nav{position:fixed; left:0; right:0; bottom:0; z-index:40; max-height:84dvh; display:flex; flex-direction:column;
  background:var(--card); border-radius:22px 22px 0 0; box-shadow:0 -12px 40px rgba(0,0,0,.2);
  transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s; visibility:hidden;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.nav.open{transform:none; visibility:visible; transition:transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s}
.brand{display:none}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 8px}
.sheet-head b{font-size:1.15rem}
.sheet-head button{border:0; background:none; color:var(--accent); font-family:var(--sans); font-weight:600; font-size:1rem; min-height:44px; padding:0 4px}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line2); margin:8px auto 0}
.nav-list{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:2px 8px 6px}
.ch-btn{display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:6px 12px; border:0; background:none;
  border-radius:12px; text-align:left; cursor:pointer; line-height:1.3}
.ch-btn .r{flex:none; width:44px; font-family:var(--sans); font-size:.8rem; font-weight:700; color:var(--muted)}
.ch-btn .n{flex:1; min-width:0}
.ch-btn .d{flex:none; width:8px; height:8px; border-radius:50%; background:var(--line2)}
.ch-btn.reached .d{background:var(--accent)}
.ch-btn.cur{background:var(--chip)}
.ch-btn.cur .r{color:var(--accent)}
@media (hover:hover){ .ch-btn:hover{background:var(--chip)} }
.nav-foot{padding:6px 18px 12px; border-top:1px solid var(--line)}
.btn-reset{border:0; background:none; color:var(--muted); font-family:var(--sans); font-size:.9rem; min-height:44px; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px}

/* ---------- iPad горизонтально и широкие экраны ---------- */
@media (min-width:900px) and (min-height:600px){
  :root{--fs:20px; --col:700px}
  .app{display:grid; grid-template-columns:320px minmax(0,1fr)}
  .top,.scrim,.sheet-head,.grab{display:none}
  .nav{position:sticky; top:0; align-self:start; height:100dvh; max-height:none; transform:none; visibility:visible;
    border-radius:0; box-shadow:none; background:var(--side); border-right:1px solid var(--line); transition:none;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left); font-size:17px}
  .brand{display:block; padding:26px 22px 14px}
  .brand .b1{font-size:2rem; font-weight:700; line-height:1.1}
  .brand .b2{font-family:var(--sans); font-size:.82rem; color:var(--muted); margin-top:4px}
  .brand .b3{font-family:var(--sans); font-size:.82rem; color:var(--muted); margin-top:12px; line-height:1.45}
  .brand .track{margin:14px 0 6px; border-radius:2px; overflow:hidden; height:4px}
  .brand .pt{font-family:var(--sans); font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .nav-list{flex:1; padding:4px 10px 8px}
  .ch-btn{min-height:40px; padding:5px 12px}
  .nav-foot{padding:4px 22px 10px}
  #feed{padding-top:22px}
  .th{padding:15px 20px 16px 58px}
  .th .num{left:16px; top:16px; width:28px; height:28px}
  .qz{padding:18px 18px 18px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Главы">
    <div class="grab"></div>
    <div class="sheet-head"><b>Главы</b><button type="button" id="navClose">Готово</button></div>
    <div class="brand">
      <div class="b1">Ася</div>
      <div class="b2">И. С. Тургенев · 1858</div>
      <div class="b3" id="brandWhat"></div>
      <div class="track"><div class="fill" id="fill2"></div></div>
      <div class="pt" id="pt2"></div>
    </div>
    <div class="nav-list" id="navList"></div>
    <div class="nav-foot"><button type="button" class="btn-reset" id="reset">Начать заново</button></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <div class="top-row">
        <div class="top-title"><b>Ася</b><span id="curLabel">Глава I</span></div>
        <div class="top-count" id="pt1"></div>
        <button type="button" class="btn-ch" id="navOpen">Главы</button>
      </div>
      <div class="track"><div class="fill" id="fill1"></div></div>
    </header>

    <div id="feed" aria-live="polite"></div>

    <div class="bar"><div class="bar-in"><button type="button" id="next">Дальше</button></div></div>
  </main>
</div>

<script>
(function(){
"use strict";

/* ============ СОДЕРЖАНИЕ ============
   t — тезис, q — цитата из текста Тургенева (необязательно)
   ask — вопрос «что было дальше?», o — 3 варианта, a — номер верного (0,1,2), why — пояснение */
var DATA = [
{n:"I", t:"Городок на Рейне", items:[
 {t:"Н. Н. вспоминает молодость: ему около двадцати пяти, он только что «вырвался на волю» и уехал за границу — не учиться, а просто посмотреть на мир.", q:"Мне было тогда лет двадцать пять"},
 {t:"Он путешествует без цели и без плана. Памятники и красивые виды его мало трогают — интересны ему только люди.", q:"Меня занимали исключительно одни люди"},
 {t:"Недавно его отвергла молодая вдова — предпочла ему баварского лейтенанта. Чтобы прийти в себя, Н. Н. поселяется в маленьком немецком городке З. на левом берегу Рейна."},
 {t:"Любимое место Н. Н. — каменная скамья под старым ясенем у реки. В ветвях ясеня стоит маленькая статуя мадонны. Запомните её: она появится в самом конце.", q:"с почти детским лицом и красным сердцем на груди, пронзенным мечами"},
 {ask:"Однажды вечером Н. Н. сидит у реки. Что было дальше?", o:["Мимо проходит вдова под руку с баварским лейтенантом","С другого берега, из городка Л., доносится музыка","Перевозчик предлагает ему прокатиться по Рейну до Кёльна"], a:1,
  why:"Музыка — случайность, с которой начинается вся история. Это в характере Н. Н.: он живёт без плана и идёт туда, куда позовёт настроение."},
 {t:"Из Л. звучит вальс: контрабас, скрипка, флейта. Старик объясняет, что студенты из города Б. приехали на коммерш — студенческий праздник."},
 {t:"Н. Н. садится в лодку перевозчика и переправляется через Рейн в Л."}
]},
{n:"II", t:"Коммерш", items:[
 {t:"Коммерш — торжественный студенческий пир с песнями и пивом. В Л. он идёт в саду гостиницы «Солнце», под липами и флагами."},
 {ask:"Н. Н. смотрит на праздник из толпы зрителей. Что было дальше?", o:["Он слышит русскую речь и знакомится с братом и сестрой — Гагиным и Асей","Студенты зовут его за стол, и он пирует с ними до утра","Он встречает знакомого из Петербурга и уходит с ним в гостиницу"], a:0,
  why:"Обычно Н. Н. избегал русских за границей, а тут заговаривает первым. Интерес к живым людям — та самая черта, о которой он говорил в гл. I."},
 {t:"В толпе Н. Н. слышит русскую речь: молодой человек зовёт девушку «Ася». У Н. Н. невольно вырывается вопрос.", q:"Вы русские?"},
 {t:"Молодой человек — Гагин. Он приглашает Н. Н. к себе. Обычно Н. Н. сторонился русских за границей, но Гагин ему сразу понравился."},
 {t:"Ася, «сестра» Гагина, — невысокая, смуглая, с короткими чёрными кудрями, как у мальчика. Она то дичится, то смеётся без причины. Брат её подбадривает.", q:"Ася, полно ежиться! он не кусается."},
 {ask:"Гагин зовёт Н. Н. в гости. Куда они идут?", o:["В гостиницу «Солнце», за стол к студентам","На развалины старого замка — смотреть закат","В домик Гагиных на винограднике над Рейном"], a:2,
  why:"Домик на винограднике станет главным местом действия: здесь будут разговоры, вальс, ночное ожидание Аси — и отсюда Гагины однажды утром исчезнут."},
 {t:"Они поднимаются в домик Гагиных на винограднике и ужинают на воздухе: кислое молоко, ягоды, хлеб, рейнвейн. Ася уходит в дом и долго стоит у окна."},
 {t:"Ночью перевозчик везёт Н. Н. обратно по лунному Рейну, Ася весело кричит ему вслед. Дома Н. Н. чувствует себя счастливым и понимает, что за весь вечер ни разу не вспомнил о вдове.", q:"Вы в лунный столб въехали"}
]},
{n:"III", t:"Этюды Гагина", items:[
 {t:"Утром Гагин будит Н. Н. песней под окном. За кофе он рассказывает, что хочет стать художником: он обеспечен, но поздно взялся за дело."},
 {t:"Н. Н. делится историей несчастной любви к вдове. Гагин слушает вежливо, но без особого сочувствия."},
 {ask:"Гагин показывает Н. Н. свои этюды. Что было дальше?", o:["Н. Н. восхищается и советует отправить их на выставку","Н. Н. честно говорит, что они живые, но незаконченные, — и Гагин сердится на себя","Н. Н. из вежливости молчит, и Гагин обижается"], a:1,
  why:"Гагин сам называет свою беду — «славянская распущенность»: начать хватает таланта, довести до конца — терпения. Мотив «не довести до конца» в повести ещё вернётся."},
 {t:"Этюды живые, но небрежные и незаконченные. Н. Н. откровенно говорит об этом. Гагин бросает картоны на диван и винит «славянскую распущенность».", q:"Коли хватит терпенья, из меня выйдет что-нибудь"},
 {t:"Хозяйка сообщает: Ася ушла на «развалину» — старый замок в двух верстах от Л. Гагин предлагает пойти за ней.", q:"Пойдемте-ка лучше Асю отыскивать"}
]},
{n:"IV", t:"Развалина", items:[
 {t:"Дорога к развалине идёт по лесистой долине с ручьём. Замок стоит на скале: четырёхугольная башня с трещиной, плющ, деревья прямо на стенах."},
 {ask:"Мужчины подходят к замку и замечают Асю. Где она?", o:["Сидит на краю стены прямо над пропастью","Читает книгу у подножия башни","Ждёт их у ворот с корзинкой ягод"], a:0,
  why:"Ася с первых сцен делает то, что пугает и привлекает внимание. Н. Н. и тревожится, и раздражается: ему кажется, что всё это нарочно."},
 {t:"Ася сидит на краю стены над пропастью. Гагин в ужасе вскрикивает, Н. Н. упрекает её в неосторожности.", q:"экая сумасшедшая!"},
 {t:"Старушка в балаганчике продаёт пиво и пряники. Ася карабкается по развалинам со стаканом воды, будто поливает цветы на стенах. Н. Н. раздражён.", q:"Да она как коза лазит"},
 {t:"Гагин поднимает тост за «даму сердца» Н. Н. Ася тут же спрашивает, есть ли у него такая дама."},
 {ask:"Прогулка окончена. Как Ася ведёт себя дальше?", o:["Запирается у себя и не выходит до вечера","Снова дерзит и хохочет за обедом","По дороге шалит, а дома надевает лучшее платье и держится как чинная барышня"], a:2,
  why:"Резкая смена ролей — главная загадка Аси. Это не каприз ради каприза: Ася ищет, какой ей быть. Почему — станет ясно в гл. VIII."},
 {t:"На обратном пути Ася хохочет и громко поёт мимо чопорной английской семьи. А дома переодевается в лучшее платье и за обедом держится чинно, как благовоспитанная барышня."},
 {t:"Вечером Ася уходит к фрау Луизе, вдове бургомистра: её тянет к людям простого круга. Когда Н. Н. и Гагин проходят мимо, Ася из окна третьего этажа бросает Гагину ветку герани.", q:"вообрази, что я дама твоего сердца"},
 {t:"По дороге домой Н. Н. раздражён и впервые думает: а сестра ли Ася Гагину?"},
 {ask:"Наутро Н. Н. снова у Гагиных. Какой он застаёт Асю?", o:["Тихой и скромной: в старом платье шьёт у окна","Снова на развалинах замка","Обиженной: она не выходит к гостю"], a:0,
  why:"После вчерашних выходок — полная тишина. Н. Н. не понимает, где настоящая Ася. Скоро он назовёт это одним словом."}
]},
{n:"V", t:"Хамелеон", items:[
 {t:"Утром Ася совсем другая: в старом платье сидит у окна, шьёт и тихо напевает — простая русская девушка."},
 {t:"Гагин пишет этюд с дубом в долине, Н. Н. идёт с ним. Они лежат на траве и говорят о живописи, о назначении художника, о молодости."},
 {t:"Ася весь день скромна и не кокетничает. Гагин шутит, что она «пост и покаяние на себя наложила». Вечером Ася рано уходит спать."},
 {ask:"Н. Н. возвращается к себе. Что он думает об Асе?", o:["Что влюблён и завтра же признается","Что она хамелеон — и всё-таки не сестра Гагину","Что больше не будет ходить к Гагиным"], a:1,
  why:"«Хамелеон» точно схватывает главную черту Аси — быструю смену облика. А подозрение «не сестра» подготовит следующее недоразумение."},
 {t:"Ложась спать, Н. Н. думает: «Что за хамелеон эта девушка!» И тут же добавляет:", q:"А все-таки она ему не сестра"}
]},
{n:"VI", t:"Беседка из акаций", items:[
 {t:"Проходят две недели. Н. Н. бывает у Гагиных каждый день. Ася его избегает, перестаёт шалить и выглядит озабоченной."},
 {t:"Ася хорошо говорит по-французски и по-немецки, но воспитание у неё странное: она горда и стыдлива. Застав её за французским романом, Н. Н. подшучивает — и слышит резкий ответ.", q:"Вы думаете, что я только смеяться умею"},
 {ask:"Вечером Н. Н. читает Гагину вслух поэму Гёте «Герман и Доротея». Что было дальше?", o:["Ася смеётся над поэмой и уходит к фрау Луизе","Ася просит книгу и читает её всю ночь","Ася тихо слушает до конца, а назавтра ведёт себя как домовитая Доротея"], a:2,
  why:"Ася примеряет на себя героинь книг: сегодня Доротея, позже — пушкинская Татьяна. Она ищет образец, на который хочется быть похожей."},
 {t:"Ася сначала мелькает рядом, потом садится и слушает «Германа и Доротею» до конца. На следующий день она подражает Доротее — домовита и степенна."},
 {t:"Н. Н. всё больше уверен, что Гагин ведёт себя не как брат: он ласков с Асей слишком снисходительно и как-то принуждённо."},
 {ask:"Однажды вечером Н. Н. проходит мимо беседки из акаций, где сидят Гагин и Ася. Что он слышит?", o:["Ася в слезах говорит Гагину, что никого не хочет любить, кроме него","Гагин говорит Асе, что скоро они вернутся в Россию","Ася просит брата больше не звать Н. Н."], a:0,
  why:"Для Н. Н. это звучит как признание возлюбленной и подтверждает его подозрения. На самом деле это привязанность сестры — но он узнает об этом только в гл. VIII."},
 {t:"Ася рыдает в беседке и говорит Гагину эти слова. Н. Н. уходит злой: он решил, что его обманывают. И ему горько.", q:"Нет, я никого не хочу любить, кроме тебя"}
]},
{n:"VII", t:"Три дня в горах", items:[
 {t:"Н. Н. уходит на три дня в горы, вверх по Рейну, к хребту, который называют Собачьей спиной. Причина у него одна.", q:"одно чувство было мне ясно: нежелание видеться с Гагиным"},
 {t:"Он ночует в деревенских харчевнях, лежит на тёплых камнях и смотрит на облака. Запоминаются мелочи: запах смолы, стук дятлов, форели в ручьях."},
 {t:"Он пробует думать о вдове — и понимает, что всё прошло. В горах Н. Н. навсегда прощается со своим увлечением."},
 {ask:"На третий день Н. Н. возвращается домой. Что его ждёт?", o:["Письмо от вдовы с просьбой о встрече","Записка Гагина: тот удивлён его исчезновением и зовёт к себе","Ася у ясеня с мадонной"], a:1,
  why:"Шаг навстречу снова делает не Н. Н. — его зовут, и он идёт. Эта пассивность героя ещё сыграет свою роль."},
 {t:"Дома Н. Н. находит записку Гагина: тот удивлён его внезапным отъездом и просит прийти. На следующий день Н. Н. отправляется в Л."}
]},
{n:"VIII", t:"Тайна Аси", items:[
 {t:"Увидев Н. Н., Ася беспричинно смеётся и убегает. Разговор не клеится. Н. Н. ссылается на срочную работу, и Гагин провожает его через Рейн."},
 {t:"У ясеня с мадонной Гагин спрашивает, что Н. Н. думает об Асе. У неё доброе сердце, говорит он, но голова бедовая.", q:"Ее надо хорошенько узнать, чтобы о ней судить"},
 {ask:"Гагин решается рассказать правду. Кто такая Ася?", o:["Его невеста — они скрывают помолвку от родных","Сирота, дочь его опекуна","Его сестра по отцу, дочь бывшей горничной Татьяны"], a:2,
  why:"Это ключ к поведению Аси: дочь барина и горничной не своя ни среди господ, ни среди прислуги. Отсюда гордость, стыдливость и желание доказать, что она «не хуже»."},
 {t:"Ася — сестра Гагина по отцу. Её мать Татьяна была горничной матери Гагина. Отец хотел на ней жениться, но Татьяна отказалась и жила у своей сестры-скотницы."},
 {t:"Гагина ещё мальчиком увёз в Петербург дядя. Когда Асе было девять, Татьяна умерла, и отец взял девочку к себе в дом."},
 {t:"Умирая, отец поручил Асю сыну. Двадцатилетний Гагин остался с тринадцатилетней девочкой на руках: четыре года пансиона в Петербурге, а в семнадцать — заграница.", q:"завещаю тебе мою дочь – твою сестру."},
 {ask:"Гагин закончил рассказ. Что чувствует Н. Н.?", o:["Облегчение: подозрения рассеялись, на душе легко","Обиду: его так долго держали в неведении","Желание уехать, чтобы не мешать брату и сестре"], a:0,
  why:"Раздражение Н. Н. держалось на мысли об обмане. Нет обмана — нет и причины сторониться Аси. Путь к сближению открыт."},
 {t:"Гагин признаётся, что с сестрой ему нелегко. Н. Н. становится легко на душе.", q:"Порох она настоящий."}
]},
{n:"IX", t:"Вальс", items:[
 {t:"Н. Н. снова у Гагиных. Ася встречает его бледная и молчаливая. Гагин замечает сестре, что гость вернулся по своей воле.", q:"Вот он опять… и, заметь, сам захотел вернуться."},
 {t:"Ася ведёт Н. Н. в виноградник; они садятся на плиту над долиной. Она расспрашивает о горах, о легенде про Лорелею, о чёрном коте фрау Луизе — и говорит откровеннее, чем раньше."},
 {t:"Мимо проходят богомольцы с хоругвями. Ася смотрит им вслед."},
 {ask:"Ася провожает взглядом богомольцев. О чём она мечтает?", o:["Поступить на сцену и стать актрисой","Пойти куда-нибудь далеко, на молитву, на трудный подвиг","Вернуться в Россию, в деревню отца"], a:1,
  why:"Ася хочет жизни, в которой есть смысл и поступок. Этим она резко отличается от Н. Н., который живёт «без цели, без плана»."},
 {t:"Ася мечтает о трудном подвиге. Н. Н. отвечает коротко: «Попытайтесь» — и замечает: «Вы честолюбивы».", q:"Пойти куда-нибудь далеко, на молитву, на трудный подвиг"},
 {t:"Ася просит почитать что-нибудь из «Евгения Онегина» и признаётся, на кого хотела бы быть похожей.", q:"А я хотела бы быть Татьяной"},
 {ask:"Вечер продолжается. Что предлагает Ася?", o:["Покататься втроём на лодке по Рейну","Спеть русские песни","Потанцевать вальс"], a:2,
  why:"Вальс станет символом их общего счастья. Запомните его: в гл. XII Ася откажется вальсировать — и по этому отказу будет видно, как много изменилось."},
 {t:"Ася просит брата сыграть вальс. Звучит вальс Ланнера; Н. Н. и Ася кружатся по комнате, и он чувствует её близость."}
]},
{n:"X", t:"Жажда счастья", items:[
 {t:"День проходит весело, как у детей. Ася мила и проста, Гагин радуется, глядя на неё."},
 {t:"Поздно вечером Н. Н. просит перевозчика пустить лодку вниз по течению. Перевозчик дремлет над вёслами, лодка плывёт сама.", q:"царственная река понесла нас."},
 {ask:"Лодка плывёт по ночному Рейну, на берегу поёт соловей. Что чувствует Н. Н.?", o:["Тоску по вдове и желание уехать","Спокойствие: всё прояснилось","Что в нём «зажглась жажда счастья»"], a:2,
  why:"Он ещё не называет это любовью к Асе — ему хочется «счастья» вообще. Н. Н. чувствует, но не формулирует. А кто не формулирует, тот и не действует."},
 {t:"Звёзды, небо и вода кажутся ему неспокойными. Н. Н. чувствует слёзы и жажду счастья.", q:"Нет! во мне зажглась жажда счастья."}
]},
{n:"XI", t:"«Что мне читать?»", items:[
 {t:"Назавтра Ася краснеет, когда Н. Н. входит. Она принарядилась, но печальна. Гагин увлечённо пишет картину — хочет «поймать природу за хвост»."},
 {t:"Ася говорит, что плохо спала: думала о жизни с матерью. Она называет себя необразованной и неумелой."},
 {ask:"Ася жалуется, что ничего не знает. О чём она просит Н. Н.?", o:["Сказать ей, что читать и что делать","Уговорить брата снова отдать её в пансион","Учить её немецкому"], a:0,
  why:"Ася признаёт за Н. Н. право решать за неё. Она доверяет ему всё — и от этого его будущая нерешительность становится ещё тяжелее."},
 {t:"Ася спрашивает, умна ли она, и просит совета: что ей читать, что делать? Она будет делать всё, что он скажет."},
 {t:"Ася сжимает его руку. Гагин зовёт Н. Н. посмотреть фон картины, и Ася уходит.", q:"Ведь вам не будет скучно со мной?"}
]},
{n:"XII", t:"Крылья", items:[
 {t:"Через час Ася возвращается и задаёт странный вопрос. Ей кажется, что всё вокруг с ней прощается.", q:"если б я умерла, вам было бы жаль меня?"},
 {t:"Ася просит верить всему, что она скажет, — даёт «честное слово». Н. Н. смеётся, и она обижается."},
 {ask:"Ася пытается объяснить, что с ней происходит. Какой образ она находит?", o:["«Я как птица в клетке»","«Крылья у меня выросли – да лететь некуда»","«Я как Лорелея: пою, а никто не слышит»"], a:1,
  why:"Крылья — любовь и готовность к поступку; «некуда» — Ася не видит, куда это чувство может привести. Ответа она ждёт от Н. Н."},
 {t:"Ася говорит о себе так:", q:"Крылья у меня выросли – да лететь некуда."},
 {t:"Гагин предлагает сыграть вальс — Ася резко отказывается и бледнеет. Вечером Н. Н. идёт к Рейну и задаёт себе вопрос.", q:"Неужели она меня любит?"},
 {ask:"На следующий день Н. Н. снова у Гагиных. Как Ася?", o:["Больна: у неё болит голова, она почти не выходит","Весела и снова лазит по развалинам","Уехала на день в Кёльн"], a:0,
  why:"Чувство Аси так сильно, что переходит в болезнь. А Н. Н. становится «скучно и пусто» — он уже тоскует по ней, хотя себе в этом не признаётся."}
]},
{n:"XIII", t:"Записка", items:[
 {t:"Н. Н. не хочет заглядывать в себя, но образ Аси засел в душе. Весь день он у Гагиных, а Асе нездоровится: она ненадолго спускается с повязанным лбом, бледная, и слабо улыбается.", q:"Это пройдет, это ничего, все пройдет, не правда ли?"},
 {t:"Следующее утро — как в полусне: ни работать, ни бездельничать не выходит. Н. Н. бродит по городу, и вдруг мальчик окликает его: «Вы ли господин Н.?» — и передаёт записку от «фрейлейн Annette»."},
 {ask:"Н. Н. разворачивает записку. Что в ней?", o:["Гагин сообщает, что они завтра уезжают","Ася просит больше не приходить","Ася просит о встрече в четыре часа у каменной часовни возле развалины"], a:2,
  why:"Ася сама назначает свидание — для барышни того времени шаг смелый, почти немыслимый. Он показывает и силу её чувства, и готовность к поступку."},
 {t:"Почерк Аси: она должна его видеть, сегодня она сделала «большую неосторожность». Встреча — в четыре часа у каменной часовни на дороге возле развалины. Н. Н. велит мальчику передать: «да»."}
]},
{n:"XIV", t:"Признание Гагина", items:[
 {t:"Н. Н. дома перечитывает записку — ещё нет полудня. Входит Гагин, пасмурный и взволнованный, и сразу говорит главное.", q:"моя сестра, Ася, в вас влюблена."},
 {t:"Ночью у Аси был жар, она плакала; хозяйка разбудила Гагина в два часа. Ася умоляла увезти её, если он хочет, чтобы она осталась жива, — и призналась в любви к Н. Н."},
 {t:"По словам Гагина, Ася полюбила Н. Н. с первого взгляда и боится, что он её презирает, раз знает её историю."},
 {ask:"Гагин задаёт Н. Н. прямой вопрос. Какой?", o:["«Вы её любите?»","«Ведь вы не женитесь на ней?»","«Зачем вы ей писали?»"], a:1,
  why:"Для Гагина главное — судьба сестры, а её будущее зависит от брака. Для Н. Н. это проверка: готов ли он к решению. И он уходит от прямого ответа."},
 {t:"Н. Н. признаёт, что Ася ему нравится, но о женитьбе прямо не отвечает. Он показывает Гагину записку Аси — тот удивлён.", q:"ведь вы не женитесь на ней?"},
 {t:"Договариваются: Н. Н. пойдёт на свидание и честно объяснится, Гагин подождёт дома. Но уехать Гагины решили в любом случае — завтра.", q:"С огнем шутить нельзя."},
 {t:"Оставшись один, Н. Н. мечется: досадует на откровенность Гагина, а любовь Аси его и радует, и смущает.", q:"Жениться на семнадцатилетней девочке, с ее нравом, как это можно!"},
 {ask:"До свидания ещё есть время. Что происходит дальше?", o:["Ася приходит к Н. Н. сама, не дождавшись четырёх часов","Тот же мальчик приносит вторую записку: встреча переносится в дом фрау Луизе","Гагин просит отменить свидание"], a:1,
  why:"Ася меняет открытую часовню у дороги на закрытую комнату. Позже Н. Н. будет корить себя, что даже не задумался, почему."}
]},
{n:"XV", t:"Ганхен", items:[
 {t:"Вторая записка: свидание переносится в дом фрау Луизе — постучать внизу и подняться на третий этаж."},
 {t:"Н. Н. заходит в сад за городской стеной, где играют в кегли и пьют пиво. Хорошенькая служанка Ганхен плачет: её жених ушёл в солдаты. Н. Н. даёт ей талер — она даже не благодарит."},
 {ask:"Н. Н. ждёт часа свидания и думает о будущем. Какое решение он принимает?", o:["Жениться он не может, и Ася не узнает, что он тоже её полюбил","Сегодня же сделать Асе предложение","Не идти на свидание и уехать"], a:0,
  why:"Решение принято до встречи — не сердцем, а рассудком. Поэтому на свидание Н. Н. идёт не признаваться, а «объясняться»."},
 {t:"Н. Н. вспоминает слова Гагина «С огнем шутить нельзя» и решает: жениться он не может.", q:"она не узнает, что и я полюбил ее"},
 {t:"В сумерках он приходит к дому фрау Луизе. В тёмной прихожей его ведёт костлявая старушечья рука, по крутой лестнице он поднимается на третий этаж."},
 {t:"Фрау Луизе с приторной улыбкой указывает на маленькую дверь. Н. Н. входит."},
 {ask:"Н. Н. входит в комнату. Что он видит?", o:["Комната пуста: Ася не пришла","Ася и Гагин ждут его вдвоём","Ася сидит у окна, закутанная в шаль, и дрожит"], a:2,
  why:"Решиться на свидание Асе было очень трудно. Она ждёт от Н. Н. одного — ответа на своё чувство."}
]},
{n:"XVI", t:"Свидание", items:[
 {t:"В полутёмной комнате у окна сидит Ася в длинной шали и дрожит. Н. Н. обращается к ней по имени-отчеству. Её рука холодна, она не может вымолвить ни слова.", q:"Анна Николаевна"},

/* ============ ПОДГОТОВКА ============ */
var LET = ["А","Б","В"];
var KEY = "asya-chrono-v1";
var ITEMS = [], CH_START = [], TH_UPTO = [], thN = 0, qN = 0;
DATA.forEach(function(ch, ci){
  CH_START[ci] = ITEMS.length;
  ch.items.forEach(function(it){
    var o = {ci: ci};
    for (var k in it) o[k] = it[k];
    if (it.ask){ o.type = "q"; o.n = ++qN; } else { o.type = "t"; o.n = ++thN; }
    ITEMS.push(o); TH_UPTO.push(thN);
  });
});
var N = ITEMS.length, TH_TOTAL = thN, Q_TOTAL = qN;

function typo(s){
  return s.replace(/Н\. Н\./g, "Н. Н.").replace(/ ([—–]) /g, " $1 ").replace(/ (гл\.) /g, " $1 ");
}
var SMOOTH = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

var st = {pos: 0, ans: {}};
try {
  var saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && typeof saved.pos === "number" && saved.pos >= 0 && saved.pos < N){
    st.pos = Math.floor(saved.pos); st.ans = saved.ans && typeof saved.ans === "object" ? saved.ans : {};
  }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }

var $ = function(id){ return document.getElementById(id); };
var feed = $("feed"), nextBtn = $("next"), nav = $("nav"), scrim = $("scrim"), navList = $("navList");
var root = document.documentElement;

/* ============ ЭЛЕМЕНТЫ ЛЕНТЫ ============ */
function mk(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function elIntro(){
  var d = mk("div", "intro");
  d.innerHTML = "<b>Как это работает.</b> Читайте тезисы по порядку и нажимайте «Дальше». Примерно каждые три шага — вопрос «что было дальше?»: выберите вариант и сразу увидите, верно ли. Прогресс сохраняется на этом устройстве.";
  return d;
}
function elChapter(ci){
  var s = mk("section", "chap"); s.id = "ch-" + ci; s.setAttribute("data-ci", ci);
  s.appendChild(mk("div", "roman", "Глава " + DATA[ci].n));
  s.appendChild(mk("h2", null, DATA[ci].t));
  return s;
}
function elThesis(it){
  var a = mk("article", "th");
  a.appendChild(mk("span", "num", String(it.n)));
  a.appendChild(mk("p", null, typo(it.t)));
  if (it.q) a.appendChild(mk("blockquote", null, "«" + it.q + "»"));
  return a;
}
function elQuestion(it, i){
  var a = mk("article", "qz");
  a.appendChild(mk("div", "lab", "Что было дальше?"));
  a.appendChild(mk("p", "ask", typo(it.ask)));
  var opts = mk("div", "opts");
  it.o.forEach(function(txt, k){
    var b = mk("button", "opt"); b.type = "button";
    b.appendChild(mk("span", "l", LET[k]));
    b.appendChild(mk("span", null, typo(txt)));
    b.addEventListener("click", function(){ answer(i, k); });
    opts.appendChild(b);
  });
  a.appendChild(opts);
  var fb = mk("div", "fb"); fb.hidden = true; a.appendChild(fb);
  if (st.ans[i] !== undefined) paintAnswer(a, it, st.ans[i]);
  return a;
}
function paintAnswer(card, it, k){
  var opts = card.querySelector(".opts"), btns = opts.querySelectorAll(".opt"), fb = card.querySelector(".fb");
  opts.classList.add("done");
  for (var j = 0; j < btns.length; j++){ btns[j].disabled = true; }
  btns[it.a].classList.add("ok");
  if (k !== it.a) btns[k].classList.add("bad");
  fb.textContent = "";
  var right = k === it.a;
  fb.appendChild(mk("span", "v " + (right ? "okt" : "badt"), right ? "Верно. " : "Неверно. "));
  if (!right) fb.appendChild(document.createTextNode("Правильный ответ — " + LET[it.a] + ". "));
  fb.appendChild(document.createTextNode(typo(it.why)));
  fb.hidden = false;
  return fb;
}
function elEnd(){
  var d = mk("section", "end"); d.id = "end";
  d.innerHTML = "<h3>Конец повести</h3><ul>" +
    "<li><b>Кульминация</b> — свидание в доме фрау Луизе (гл. XVI): на порыв Аси Н. Н. отвечает упрёками.</li>" +
    "<li><b>Ключ к повести</b> — «одно слово» из записки Аси (гл. XXI).</li>" +
    "<li><b>«У счастья нет завтрашнего дня»</b> (гл. XX): Н. Н. откладывает — и теряет.</li>" +
    "<li><b>Сквозные детали:</b> мадонна на ясене (гл. I и XXI), вальс (гл. IX и XII), цветок герани (гл. IV и XXII).</li>" +
    "<li><b>Тип героя</b> — «лишний человек»: тонко чувствует, но в решающий момент не действует. См. статью Н. Г. Чернышевского «Русский человек на rendez-vous» (1858).</li>" +
    "</ul>";
  return d;
}

function appendItem(i, animate){
  var it = ITEMS[i], head = null;
  if (CH_START[it.ci] === i){ head = elChapter(it.ci); if (animate) head.classList.add("new"); feed.appendChild(head); }
  var el = it.type === "t" ? elThesis(it) : elQuestion(it, i);
  el.id = "it-" + i; if (animate) el.classList.add("new");
  feed.appendChild(el);
  return {head: head, el: el};
}
function syncEnd(animate){
  var end = $("end");
  if (st.pos === N - 1 && !end){ end = elEnd(); if (animate) end.classList.add("new"); feed.appendChild(end); return end; }
  if (st.pos !== N - 1 && end) end.remove();
  return null;
}
function render(){
  feed.textContent = "";
  feed.appendChild(elIntro());
  for (var i = 0; i <= st.pos; i++) appendItem(i, false);
  syncEnd(false);
  curCh = -1; update(); trackChapter();
}

/* ============ ЛОГИКА ============ */
function pending(){ var it = ITEMS[st.pos]; return it.type === "q" && st.ans[st.pos] === undefined; }

function update(){
  if (st.pos === N - 1 && !pending()){ nextBtn.textContent = "Пройти заново"; nextBtn.disabled = false; }
  else if (pending()){ nextBtn.textContent = "Выберите ответ"; nextBtn.disabled = true; }
  else { nextBtn.textContent = "Дальше"; nextBtn.disabled = false; }
  var done = TH_UPTO[st.pos], frac = ((st.pos + 1) / N * 100).toFixed(1) + "%";
  $("fill1").style.width = frac; $("fill2").style.width = frac;
  $("pt1").textContent = done + "/" + TH_TOTAL;
  $("pt2").textContent = "Тезис " + done + " из " + TH_TOTAL;
  var btns = navList.children;
  for (var c = 0; c < btns.length; c++) btns[c].classList.toggle("reached", CH_START[c] <= st.pos);
}

function next(){
  if (st.pos === N - 1 && !pending()){ restart(); return; }
  if (pending() || st.pos >= N - 1) return;
  st.pos++; save();
  var r = appendItem(st.pos, true);
  var end = syncEnd(true);
  update();
  requestAnimationFrame(function(){
    if (r.head) r.head.scrollIntoView({behavior: SMOOTH, block: "start"});
    else r.el.scrollIntoView({behavior: SMOOTH, block: "nearest"});
    if (end) setTimeout(function(){ end.scrollIntoView({behavior: SMOOTH, block: "nearest"}); }, 380);
  });
}

function answer(i, k){
  if (st.ans[i] !== undefined) return;
  st.ans[i] = k; save();
  var card = $("it-" + i);
  var fb = paintAnswer(card, ITEMS[i], k);
  fb.classList.add("new");
  update();
  requestAnimationFrame(function(){ fb.scrollIntoView({behavior: SMOOTH, block: "nearest"}); });
  if (i === st.pos) nextBtn.focus({preventScroll: true});
}

function restart(){
  if (!confirm("Начать заново? Прогресс и ответы будут сброшены.")) return;
  st = {pos: 0, ans: {}}; save(); closeNav(); render();
  window.scrollTo({top: 0, behavior: "auto"});
}

function jump(ci){
  var idx = CH_START[ci];
  if (idx > st.pos){
    if (!confirm("Перейти к главе " + DATA[ci].n + "? Пропущенные вопросы останутся без ответа — к ним можно вернуться, прокрутив вверх.")) return;
    st.pos = idx; save(); render();
  }
  closeNav();
  var h = $("ch-" + ci);
  if (h) requestAnimationFrame(function(){ h.scrollIntoView({behavior: SMOOTH, block: "start"}); });
}

/* ============ ГЛАВЫ: список, шторка, текущая глава ============ */
DATA.forEach(function(ch, ci){
  var b = mk("button", "ch-btn"); b.type = "button";
  b.appendChild(mk("span", "r", ch.n));
  b.appendChild(mk("span", "n", ch.t));
  b.appendChild(mk("span", "d"));
  b.addEventListener("click", function(){ jump(ci); });
  navList.appendChild(b);
});
function plural(n, a, b, c){ var m10 = n % 10, m100 = n % 100; return n + " " + (m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? b : c); }
$("brandWhat").textContent = "Вся повесть по порядку: " + plural(TH_TOTAL, "тезис", "тезиса", "тезисов") + " и " + plural(Q_TOTAL, "вопрос", "вопроса", "вопросов") + " «что было дальше?».";

var navIsSheet = function(){ return getComputedStyle($("navClose")).display !== "none" && getComputedStyle(document.querySelector(".sheet-head")).display !== "none"; };
function openNav(){
  nav.classList.add("open"); scrim.classList.add("show");
  var cur = navList.children[Math.max(curCh, 0)];
  if (cur) cur.scrollIntoView({block: "center"});
}
function closeNav(){ nav.classList.remove("open"); scrim.classList.remove("show"); }
$("navOpen").addEventListener("click", openNav);
$("navClose").addEventListener("click", closeNav);
scrim.addEventListener("click", closeNav);
$("reset").addEventListener("click", restart);
nextBtn.addEventListener("click", next);

var curCh = -1, ticking = false;
function trackChapter(){
  var heads = feed.querySelectorAll(".chap"), lim = Math.max((parseFloat(getComputedStyle(root).getPropertyValue("--hdr")) || 0) + 70, innerHeight * 0.45), cur = 0;
  if (scrollY + innerHeight >= document.documentElement.scrollHeight - 4) lim = innerHeight - (parseFloat(getComputedStyle(root).getPropertyValue("--bar")) || 0) - 40;
  for (var j = 0; j < heads.length; j++){
    if (heads[j].getBoundingClientRect().top <= lim) cur = +heads[j].getAttribute("data-ci"); else break;
  }
  if (cur === curCh) return;
  curCh = cur;
  $("curLabel").textContent = "Глава " + DATA[cur].n + " · " + DATA[cur].t;
  var btns = navList.children;
  for (var c = 0; c < btns.length; c++){
    var on = c === cur; btns[c].classList.toggle("cur", on);
    if (on) btns[c].setAttribute("aria-current", "true"); else btns[c].removeAttribute("aria-current");
  }
  if (!navIsSheet()){
    var b = btns[cur], box = navList.getBoundingClientRect(), bb = b.getBoundingClientRect();
    if (bb.top < box.top || bb.bottom > box.bottom) b.scrollIntoView({block: "nearest"});
  }
}
window.addEventListener("scroll", function(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(function(){ ticking = false; trackChapter(); });
}, {passive: true});

function measure(){
  var t = document.querySelector(".top"), b = document.querySelector(".bar");
  root.style.setProperty("--hdr", (t.offsetHeight || 0) + "px");
  root.style.setProperty("--bar", (b.offsetHeight || 0) + "px");
  if (!navIsSheet()) closeNav();
}
window.addEventListener("resize", measure);
window.addEventListener("orientationchange", function(){ setTimeout(measure, 250); });

/* ============ КЛАВИАТУРА (iPad с клавиатурой) ============ */
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape"){ closeNav(); return; }
  if (nav.classList.contains("open")) return;
  if (pending()){
    var map = {"1":0,"2":1,"3":2,"а":0,"б":1,"в":2,"a":0,"b":1,"c":2};
    var k = map[(e.key || "").toLowerCase()];
    if (k !== undefined){ e.preventDefault(); answer(st.pos, k); return; }
  }
  if (e.key === "ArrowRight" || ((e.key === "Enter" || e.key === " ") && !(document.activeElement && document.activeElement.tagName === "BUTTON"))){
    e.preventDefault(); if (!nextBtn.disabled) next();
  }
});

/* ============ СТАРТ ============ */
measure();
render();
if (st.pos > 0){
  var last = $("end") || $("it-" + st.pos);
  if (last) last.scrollIntoView({block: "nearest"});
  trackChapter();
}
})();
</script>
</body>
</html>
