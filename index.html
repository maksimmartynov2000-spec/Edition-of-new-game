<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Словарные слова — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f2e8;
    --line: #d8cfba;
    --ink: #23324d;
    --ink-soft: #4a597a;
    --red: #b8402f;
    --green: #2f7a52;
    --gold: #c99b3d;
    --card: #fffdf8;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 38px,
      var(--line) 38px, var(--line) 39px
    );
    color: var(--ink);
    font-family: 'Nunito Sans', system-ui, sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 16px 14px 30px;
  }
  h1{
    font-family:'PT Serif', Georgia, serif;
    font-weight:700;
    font-size: clamp(20px, 5vw, 28px);
    margin: 4px 0 14px;
    text-align:center;
    color: var(--ink);
  }

  .tabs{
    display:flex;
    gap:6px;
    background: rgba(35,50,77,0.07);
    padding:5px;
    border-radius: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    justify-content:center;
  }
  .tab{
    border:none;
    background:transparent;
    padding: 9px 16px;
    border-radius: 9px;
    font-family:'Nunito Sans',sans-serif;
    font-weight:700;
    font-size: 14px;
    color: var(--ink-soft);
    cursor:pointer;
    transition: background .15s, color .15s;
  }
  .tab.active{
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(35,50,77,.18);
  }

  .statusbar{
    width:100%;
    max-width: 560px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 0 4px;
    margin-bottom: 10px;
  }
  .statusbar b{ color: var(--ink); }
  .progress-track{
    width:100%;
    max-width:560px;
    height: 6px;
    background: rgba(35,50,77,.1);
    border-radius: 4px;
    overflow:hidden;
    margin-bottom: 20px;
  }
  .progress-fill{
    height:100%;
    background: var(--gold);
    width:0%;
    transition: width .3s;
  }

  .card{
    background: var(--card);
    width:100%;
    max-width: 560px;
    border-radius: 16px;
    box-shadow: 0 3px 0 var(--line), 0 8px 24px rgba(35,50,77,.12);
    padding: 34px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 18px;
    min-height: 220px;
    justify-content:center;
  }

  .speak-btn{
    border: 2px solid var(--ink);
    background: var(--card);
    color: var(--ink);
    width: 46px; height:46px;
    border-radius: 50%;
    font-size: 20px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s, background .12s;
  }
  .speak-btn:active{ transform: scale(.92); }
  .speak-btn:hover{ background: rgba(201,155,61,.15); }

  .word-display{
    font-family:'PT Serif', Georgia, serif;
    font-size: clamp(28px, 7vw, 40px);
    letter-spacing: 1px;
    color: var(--ink);
    text-align:center;
  }

  input.dictation-input{
    width: 100%;
    max-width: 380px;
    font-family:'PT Serif', Georgia, serif;
    font-size: 24px;
    padding: 10px 14px;
    border: none;
    border-bottom: 3px solid var(--ink-soft);
    background: transparent;
    text-align:center;
    color: var(--ink);
    outline:none;
  }
  input.dictation-input:focus{ border-bottom-color: var(--gold); }

  .blank-word{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: 3px;
    font-family:'PT Serif', Georgia, serif;
    font-size: clamp(26px, 6.5vw, 36px);
  }
  .letter{
    display:inline-block;
    min-width: 0.75em;
    text-align:center;
  }
  .blank-input{
    width: 1em;
    min-width: 30px;
    font-family:'PT Serif', Georgia, serif;
    font-size: inherit;
    text-align:center;
    border:none;
    border-bottom: 3px solid var(--red);
    background: rgba(184,64,47,.06);
    color: var(--ink);
    outline:none;
    padding: 0 2px;
  }
  .blank-input:focus{ background: rgba(184,64,47,.14); }

  .feedback{
    font-size: 15px;
    font-weight:700;
    min-height: 20px;
    text-align:center;
  }
  .feedback.correct{ color: var(--green); }
  .feedback.incorrect{ color: var(--red); }

  .flip-zone{
    perspective: 1000px;
    width:100%;
    max-width: 380px;
    height: 130px;
  }
  .flip-inner{
    position:relative;
    width:100%; height:100%;
    transition: transform .5s;
    transform-style: preserve-3d;
  }
  .flip-inner.flipped{ transform: rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    backface-visibility: hidden;
    border-radius: 12px;
    font-family:'PT Serif', Georgia, serif;
    font-size: clamp(24px, 6vw, 32px);
    text-align:center;
    padding: 10px;
  }
  .flip-front{
    background: rgba(35,50,77,.05);
    color: var(--ink-soft);
    letter-spacing: 3px;
  }
  .flip-back{
    background: rgba(47,122,82,.1);
    color: var(--green);
    transform: rotateY(180deg);
  }

  .btn-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content:center;
    width:100%;
  }
  button.action{
    font-family:'Nunito Sans',sans-serif;
    font-weight:800;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    cursor:pointer;
    transition: transform .1s, opacity .1s;
  }
  button.action:active{ transform: scale(.97); }
  .btn-primary{ background: var(--ink); color: var(--card); }
  .btn-primary:hover{ opacity:.9; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 2px solid rgba(35,50,77,.25); }
  .btn-ghost:hover{ background: rgba(35,50,77,.06); }
  .btn-remember{ background: var(--green); color: #fff; }
  .btn-forgot{ background: var(--red); color: #fff; }

  .restart-row{
    margin-top: 16px;
  }
  .restart-row .btn-ghost{
    font-size: 13px;
    padding: 8px 16px;
  }

  .done-card{
    text-align:center;
  }
  .done-card .big{
    font-family:'PT Serif', Georgia, serif;
    font-size: 22px;
    margin-bottom: 6px;
  }

  @media (prefers-reduced-motion: reduce){
    .flip-inner{ transition: none; }
  }
</style>
</head>
<body>

  <h1>Словарные слова</h1>

  <div class="tabs" id="tabs">
    <button class="tab active" data-mode="dictation">Диктант</button>
    <button class="tab" data-mode="blanks">Пропуски</button>
    <button class="tab" data-mode="cards">Карточки</button>
  </div>

  <div class="statusbar">
    <span>Слово <b id="wordIndex">1</b> из <b id="wordTotal">24</b></span>
    <span>Верно: <b id="scoreCorrect">0</b> · Ошибок: <b id="scoreWrong">0</b></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card" id="card"></div>

  <div class="restart-row">
    <button class="action btn-ghost" id="restartBtn">↻ Заново</button>
  </div>

<script>
(function(){
  const WORDS = [
    "багаж","багажный","багровый","багроветь","багряный","бадминтон",
    "баланс","балансировать","балкон","балконный","барельеф",
    "баскетбол","баскетбольный","бассейн","берёза","берёзовый",
    "беречь","бирюзовый","богатый","богатство","богатырь",
    "брошюра","брошюровать","бюллетень"
  ];
  const VOWELS = "аеёиоуыэюя";

  let mode = "dictation";
  let order = [];
  let pos = 0;
  let correct = 0, wrong = 0;
  let answeredCurrent = false;

  const cardEl = document.getElementById("card");
  const wordIndexEl = document.getElementById("wordIndex");
  const wordTotalEl = document.getElementById("wordTotal");
  const scoreCorrectEl = document.getElementById("scoreCorrect");
  const scoreWrongEl = document.getElementById("scoreWrong");
  const progressFillEl = document.getElementById("progressFill");

  wordTotalEl.textContent = WORDS.length;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function newSession(){
    order = shuffle(WORDS.map((_,i)=>i));
    pos = 0;
    correct = 0; wrong = 0;
    answeredCurrent = false;
    updateStatus();
    renderCurrent();
  }

  function updateStatus(){
    wordIndexEl.textContent = Math.min(pos+1, WORDS.length);
    scoreCorrectEl.textContent = correct;
    scoreWrongEl.textContent = wrong;
    progressFillEl.style.width = (pos/WORDS.length*100) + "%";
  }

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU";
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }

  function currentWord(){
    return WORDS[order[pos]];
  }

  function nextWord(){
    pos++;
    answeredCurrent = false;
    if(pos >= WORDS.length){
      renderDone();
    } else {
      updateStatus();
      renderCurrent();
    }
  }

  function renderDone(){
    updateStatus();
    progressFillEl.style.width = "100%";
    cardEl.innerHTML = `
      <div class="done-card">
        <div class="big">Готово! Слова закончились.</div>
        <div>Правильно: ${correct} из ${WORDS.length}</div>
      </div>
    `;
  }

  function speakerIcon(word){
    const b = document.createElement("button");
    b.className = "speak-btn";
    b.type = "button";
    b.textContent = "🔊";
    b.setAttribute("aria-label","Произнести слово");
    b.addEventListener("click", ()=> speak(word));
    return b;
  }

  // ---------- MODE: DICTATION ----------
  function renderDictation(){
    const word = currentWord();
    cardEl.innerHTML = "";

    const spk = speakerIcon(word);
    cardEl.appendChild(spk);

    const input = document.createElement("input");
    input.className = "dictation-input";
    input.type = "text";
    input.autocomplete = "off";
    input.autocapitalize = "off";
    input.spellcheck = false;
    input.placeholder = "Напишите слово…";
    cardEl.appendChild(input);

    const feedback = document.createElement("div");
    feedback.className = "feedback";
    cardEl.appendChild(feedback);

    const row = document.createElement("div");
    row.className = "btn-row";
    const checkBtn = document.createElement("button");
    checkBtn.className = "action btn-primary";
    checkBtn.textContent = "Проверить";
    row.appendChild(checkBtn);
    cardEl.appendChild(row);

    function doCheck(){
      if(answeredCurrent) return;
      const val = input.value.trim().toLowerCase().replace(/ё/g,"ё");
      const target = word.toLowerCase();
      const ok = val === target;
      answeredCurrent = true;
      if(ok){
        correct++;
        feedback.textContent = "Верно!";
        feedback.className = "feedback correct";
      } else {
        wrong++;
        feedback.textContent = "Правильно: " + word;
        feedback.className = "feedback incorrect";
      }
      updateStatus();
      checkBtn.textContent = "Дальше";
      input.disabled = true;
    }

    checkBtn.addEventListener("click", ()=>{
      if(!answeredCurrent){ doCheck(); }
      else { nextWord(); }
    });
    input.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        if(!answeredCurrent){ doCheck(); } else { nextWord(); }
      }
    });

    setTimeout(()=>{ speak(word); input.focus(); }, 150);
  }

  // ---------- MODE: BLANKS ----------
  function pickBlankIndices(word){
    const n = word.length;
    const vowelIdx = [];
    for(let i=1;i<n;i++){
      if(VOWELS.includes(word[i])) vowelIdx.push(i);
    }
    const pool = vowelIdx.length ? vowelIdx : Array.from({length:n-2},(_,i)=>i+1);
    const count = n > 7 ? Math.min(2, pool.length) : Math.min(1, pool.length);
    const shuffled = shuffle(pool);
    return shuffled.slice(0, Math.max(count,1)).sort((a,b)=>a-b);
  }

  function renderBlanks(){
    const word = currentWord();
    const blankIdx = pickBlankIndices(word);
    cardEl.innerHTML = "";

    const spk = speakerIcon(word);
    cardEl.appendChild(spk);

    const wrap = document.createElement("div");
    wrap.className = "blank-word";
    const inputs = [];

    for(let i=0;i<word.length;i++){
      if(blankIdx.includes(i)){
        const inp = document.createElement("input");
        inp.className = "blank-input";
        inp.maxLength = 1;
        inp.autocomplete = "off";
        inp.spellcheck = false;
        inputs.push({el: inp, correctLetter: word[i]});
        wrap.appendChild(inp);
      } else {
        const span = document.createElement("span");
        span.className = "letter";
        span.textContent = word[i];
        wrap.appendChild(span);
      }
    }
    cardEl.appendChild(wrap);

    inputs.forEach((obj, idx)=>{
      obj.el.addEventListener("input", ()=>{
        obj.el.value = obj.el.value.slice(-1);
        if(obj.el.value && idx < inputs.length-1){
          inputs[idx+1].el.focus();
        }
      });
    });

    const feedback = document.createElement("div");
    feedback.className = "feedback";
    cardEl.appendChild(feedback);

    const row = document.createElement("div");
    row.className = "btn-row";
    const checkBtn = document.createElement("button");
    checkBtn.className = "action btn-primary";
    checkBtn.textContent = "Проверить";
    row.appendChild(checkBtn);
    cardEl.appendChild(row);

    function doCheck(){
      if(answeredCurrent) return;
      let ok = true;
      inputs.forEach(obj=>{
        const val = (obj.el.value || "").toLowerCase();
        if(val !== obj.correctLetter.toLowerCase()){
          ok = false;
          obj.el.style.color = "var(--red)";
        } else {
          obj.el.style.color = "var(--green)";
        }
        obj.el.disabled = true;
      });
      answeredCurrent = true;
      if(ok){
        correct++;
        feedback.textContent = "Верно!";
        feedback.className = "feedback correct";
      } else {
        wrong++;
        feedback.textContent = "Правильно: " + word;
        feedback.className = "feedback incorrect";
      }
      updateStatus();
      checkBtn.textContent = "Дальше";
    }

    checkBtn.addEventListener("click", ()=>{
      if(!answeredCurrent){ doCheck(); } else { nextWord(); }
    });
    wrap.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        if(!answeredCurrent){ doCheck(); } else { nextWord(); }
      }
    });

    setTimeout(()=>{ speak(word); if(inputs[0]) inputs[0].el.focus(); }, 150);
  }

  // ---------- MODE: CARDS ----------
  function scrambled(word){
    const letters = word.split("");
    let s;
    do {
      s = shuffle(letters).join("");
    } while (s === word && word.length > 2);
    return s;
  }

  function renderCards(){
    const word = currentWord();
    cardEl.innerHTML = "";

    const spk = speakerIcon(word);
    cardEl.appendChild(spk);

    const zone = document.createElement("div");
    zone.className = "flip-zone";
    const inner = document.createElement("div");
    inner.className = "flip-inner";
    const front = document.createElement("div");
    front.className = "flip-face flip-front";
    front.textContent = scrambled(word);
    const back = document.createElement("div");
    back.className = "flip-face flip-back";
    back.textContent = word;
    inner.appendChild(front);
    inner.appendChild(back);
    zone.appendChild(inner);
    cardEl.appendChild(zone);

    const row1 = document.createElement("div");
    row1.className = "btn-row";
    const flipBtn = document.createElement("button");
    flipBtn.className = "action btn-primary";
    flipBtn.textContent = "Показать слово";
    row1.appendChild(flipBtn);
    cardEl.appendChild(row1);

    const row2 = document.createElement("div");
    row2.className = "btn-row";
    row2.style.display = "none";
    const rememberBtn = document.createElement("button");
    rememberBtn.className = "action btn-remember";
    rememberBtn.textContent = "Вспомнил(а)";
    const forgotBtn = document.createElement("button");
    forgotBtn.className = "action btn-forgot";
    forgotBtn.textContent = "Забыл(а)";
    row2.appendChild(rememberBtn);
    row2.appendChild(forgotBtn);
    cardEl.appendChild(row2);

    flipBtn.addEventListener("click", ()=>{
      inner.classList.add("flipped");
      row1.style.display = "none";
      row2.style.display = "flex";
      speak(word);
    });
    rememberBtn.addEventListener("click", ()=>{
      correct++; updateStatus(); nextWord();
    });
    forgotBtn.addEventListener("click", ()=>{
      wrong++; updateStatus(); nextWord();
    });

    setTimeout(()=>{ speak(word); }, 150);
  }

  function renderCurrent(){
    if(mode === "dictation") renderDictation();
    else if(mode === "blanks") renderBlanks();
    else renderCards();
  }

  document.getElementById("tabs").addEventListener("click", (e)=>{
    const btn = e.target.closest(".tab");
    if(!btn) return;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    answeredCurrent = false;
    if(pos < WORDS.length) renderCurrent();
  });

  document.getElementById("restartBtn").addEventListener("click", newSession);

  newSession();
})();
</script>
</body>
</html>
