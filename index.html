<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кому на Руси жить хорошо — по тезисам</title>
<meta name="theme-color" content="#f6f1e7">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2520; --muted:#7a6f63; --line:#e4d9c7;
  --acc:#9a3f14; --acc-soft:#f3e2d3; --ok:#2e7d4f; --ok-soft:#e1f2e7; --bad:#b3261e; --bad-soft:#fbe4e1;
  --quote:#f1e9da;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(246,241,231,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.top h1{font-size:16px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:15px}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:18px 16px 140px}
.serif{font-family:Georgia,"Times New Roman",serif}
.hero h2{font-family:Georgia,serif;font-size:30px;line-height:1.2;margin:10px 0 6px;color:var(--acc)}
.hero p{margin:0 0 12px}
.lead{color:var(--muted);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}
.parts{display:grid;gap:12px;margin-top:16px}
.part-btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.part-btn b{display:block;font-size:19px}
.part-btn small{color:var(--muted);font-size:14px}
.mini{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc)}
.primary{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:600;margin-top:16px}
.part-title{font-family:Georgia,serif;color:var(--acc);font-size:28px;line-height:1.2;margin:8px 0 4px}
.chap{font-family:Georgia,serif;font-size:23px;margin:30px 0 8px;padding-top:6px;border-top:2px solid var(--acc);scroll-margin-top:70px}
.th{display:flex;gap:12px;margin:12px 0;animation:in .35s ease}
.num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.th .tx{flex:1}
.quote{margin:8px 0 2px;background:var(--quote);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:10px 14px;font-family:Georgia,serif;font-style:italic;white-space:pre-line;font-size:17.5px}
.quiz{background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:16px 18px;margin:22px 0;animation:in .35s ease}
.quiz .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:700}
.quiz .q{font-weight:600;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:17px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:16.5px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.next{margin-top:12px;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;width:100%}
.done{text-align:center;color:var(--muted);margin:30px 0}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;display:none}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,86vw);background:var(--bg);z-index:31;transform:translateX(-102%);transition:transform .25s;overflow-y:auto;padding:16px 16px 40px;border-right:1px solid var(--line)}
.open .drawer{transform:none}.open .drawer-bg{display:block}
.drawer h3{font-family:Georgia,serif;color:var(--acc);margin:18px 0 6px;font-size:19px}
.drawer a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:16px}
.drawer a:hover{background:var(--acc-soft)}
.drawer a.locked{color:#b5aa9c;pointer-events:none}
.drawer a.locked::after{content:" · ещё не открыто";font-size:12px}
.reset{margin-top:24px;border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px}
.note{font-size:14px;color:var(--muted)}
.part-head{font-family:Georgia,serif;color:var(--acc);font-size:22px;margin:26px 0 0}
.part-head small{display:block;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--muted);font-size:14px}
.ch-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.ch-btn b{font-size:17px}.ch-btn em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap}.ch-btn em.ok{color:var(--ok);font-size:20px}
.parts{gap:8px;margin-top:10px}
.crumb{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.chap.first{margin-top:4px;border-top:0;padding-top:0}
.navrow{display:grid;gap:10px}.navrow .primary{margin-top:0}
.sec{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-size:16px}
.drawer a.cur{background:var(--acc-soft);font-weight:600}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;background:linear-gradient(transparent,var(--bg) 35%);padding:24px 16px calc(14px + env(safe-area-inset-bottom))}
#bottom .in{max-width:760px;margin:0 auto}
#moreBtn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:600;box-shadow:0 4px 14px rgba(154,63,20,.25)}
#moreBtn:disabled{background:#cdbfae;box-shadow:none;cursor:default}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:700px){html,body{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <button class="icon-btn" id="menuBtn" aria-label="Оглавление">☰</button>
  <h1 id="topTitle">Кому на Руси жить хорошо</h1>
  <button class="icon-btn" id="homeBtn">Главная</button>
</div><div class="bar"><i id="bar"></i></div></div>

<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer"></nav>

<main id="main"></main>
<div id="bottom"><div class="in"><button id="moreBtn">Дальше ↓</button></div></div>

<script>
/* ===== ДАННЫЕ =====
  ["h","Глава"]                         — заголовок главы
  ["t","текст","цитата (необязательно)"] — тезис
  ["q","вопрос",["A","B","C"],верный_индекс,"пояснение"] — вопрос
*/
const PARTS = [
{id:"p1", title:"Часть первая", sub:"Пролог и главы «Поп», «Сельская ярмонка», «Пьяная ночь», «Счастливые», «Помещик»", items:[
["h","Пролог"],
["t","Некрасов писал поэму с 1863 по 1877 год и не успел закончить. Действие происходит вскоре после отмены крепостного права (1861)."],
["t","Начало — как в сказке: не сказано ни года, ни места. На большой дороге встречаются <b>семь мужиков</b>.","В каком году — рассчитывай,\nВ какой земле — угадывай,\nНа столбовой дороженьке\nСошлись семь мужиков"],
["t","Мужики — <b>временнообязанные</b>: по закону уже свободны, но пока не выкупили землю, обязаны работать на помещика или платить ему."],
["t","Названия мест «говорящие»: губерния Подтянутая, уезд Терпигорев, волость Пустопорожняя, деревни Заплатово, Дырявино, Разутово, Знобишино, Горелово, Неелово, Неурожайка. Всё это — про бедность и терпение."],
["t","Мужики заспорили о главном вопросе поэмы:","Кому живётся весело,\nВольготно на Руси?"],
["q","Что значит, что мужики «временнообязанные»?",["Они ещё обязаны работать или платить помещику","Их временно забрали в солдаты","Они наняты на работу на время"],0,"После 1861 года крестьяне стали свободными, но до выкупа земли оставались «временно обязанными» помещику."],
["t","Ответы разные: <b>Роман</b> — помещику, <b>Демьян</b> — чиновнику, <b>Лука</b> — попу."],
["t","<b>Братья Губины, Иван и Митродор</b>, — купцу; старик <b>Пахом</b> — вельможе, министру; <b>Пров</b> — царю."],
["t","Заметьте: все называют тех, кто <b>выше</b> мужика. Что счастье может быть у самого народа, им в голову не приходит."],
["t","Каждый стоит на своём. Мужики забывают, куда шли, спорят до ночи, разводят костёр и в конце концов дерутся."],
["t","Шум будит весь лес: откликается эхо, сбегаются звери, слетаются птицы. Пахом ловит птенчика пеночки."],
["q","Кому, по мнению Луки, живётся лучше всех?",["Купцу","Попу","Царю"],1,"Лука уверен, что лучше всех живётся попу. Первая же встреча это проверит."],
["t","Мать-пеночка просит отпустить птенца и за это рассказывает, где спрятана <b>скатерть-самобранка</b>. Она будет кормить мужиков в пути."],
["t","Пеночка предупреждает: просить больше ведра водки в день нельзя — иначе случится беда. А их одежда в дороге не износится."],
["t","Мужики дают зарок: не возвращаться домой, пока не узнают, <b>кому живётся весело, вольготно на Руси</b>. Так начинается их путешествие."],
["q","Что пеночка дала мужикам в обмен на птенца?",["Кошелёк с деньгами","Скатерть-самобранку","Волшебные сапоги"],1,"Пеночка рассказала, где зарыта скатерть-самобранка. Это сказочный элемент: число семь, говорящая птица, волшебный предмет."],

["h","Глава I. Поп"],
["t","Первым странники встречают <b>попа</b>. Лука задаёт ему вопрос: сладко ли живётся?"],
["t","Поп сначала спрашивает, что такое счастье, и сам отвечает:","В чём счастие, по-вашему?\nПокой, богатство, честь —\nНе так ли, други милые?"],
["t","<b>Покоя нет.</b> Попа зовут к больным и умирающим в любой час и в любую погоду — отказать он не может."],
["t","Тяжелее всего — видеть чужое горе: слёзы сирот, плач вдов, смерть."],
["t","<b>Богатства нет.</b> Раньше доход давали помещики: свадьбы, крестины, похороны в усадьбах. Теперь они разъехались по городам и за границу."],
["q","Из каких трёх вещей, по словам попа, состоит счастье?",["Здоровье, семья, вера","Покой, богатство, честь","Свобода, земля, воля"],1,"Покой, богатство, честь — и поп по очереди доказывает, что у него нет ни одного из трёх."],
["t","Остались крестьяне, а они нищие. Брать с бедняков последнее совестно, но иначе попу не прожить."],
["t","<b>Чести нет.</b> Народ сочиняет про попов насмешливые сказки и песни, встретить попа считается дурной приметой."],
["t","Поп уходит, а мужики набрасываются на Луку: вот тебе и сладкая поповская жизнь. Вывод: поп не счастлив."],

["h","Глава II. Сельская ярмонка"],
["t","Странники приходят на ярмарку в <b>село Кузьминское</b> — богатое, торговое и очень грязное. («Ярмонка» — старое народное слово, то же, что «ярмарка».)"],
["t","Ярмарка шумит: торгуют, пьют, пляшут, смеются. Больше всего в селе питейных заведений."],
["q","Где проходит ярмарка?",["В селе Кузьминском","В уездном городе","В деревне Заплатово"],0,"Ярмарка — в богатом, но грязном торговом селе Кузьминском."],
["t","У лавки горюет <b>старик Вавила</b>: обещал внучке козловые ботинки, а деньги пропил."],
["t","Ботинки ему покупает <b>барин Павлуша Веретенников</b> — он собирает народные песни и пословицы. Вавила от радости даже забыл сказать спасибо."],
["t","В лавке с книжками народ покупает лубок: портреты генералов, глупые книжки вроде «Милорда глупого»."],
["t","Авторское отступление — мечта о просвещении народа:","Когда мужик не Блюхера\nИ не милорда глупого —\nБелинского и Гоголя\nС базара понесёт?"],
["t","Народ толпится у балагана с Петрушкой и хохочет. К вечеру вся ярмарка пьяна."],
["q","Кто купил ботинки внучке Вавилы?",["Поп","Помещик Оболт-Оболдуев","Барин Павлуша Веретенников"],2,"Веретенников — собиратель песен и пословиц. Он ещё появится в следующей главе."],

["h","Глава III. Пьяная ночь"],
["t","Ночью народ расходится с ярмарки. Вся дорога — пьяные: кто падает в канаву, кто поёт, кто ругается."],
["t","Бабы спорят, у кого дома хуже. Странники слушают разговоры — это живая картина народной жизни."],
["t","Веретенников записывает песни и пословицы, а потом упрекает мужиков: пьют до одури, оттого и бедны."],
["t","Ему отвечает <b>Яким Нагой</b> из деревни Босово:","Он до смерти работает,\nДо полусмерти пьёт!.."],
["t","Портрет Якима: грудь впалая, лицо в морщинах, как трещины на высохшей земле. Он похож на саму землю-матушку."],
["q","Кто заступился за мужиков, когда их упрекали в пьянстве?",["Яким Нагой","Вавила","Ермил Гирин"],0,"Яким Нагой — один из главных народных голосов первой части."],
["t","Яким говорит: пьянство меряют, а горе и непосильный труд никто не меряет.","Нет меры хмелю русскому.\nА горе наше меряли?\nРаботе мера есть?"],
["t","Смысл: мужик пьёт не от природной распущенности, а от тяжёлой жизни."],
["t","Судьба Якима: жил в Петербурге, вздумал тягаться с купцом — попал в тюрьму, вернулся в деревню и стал пахать землю."],
["t","Сыну он купил лубочные картинки и сам их полюбил. На пожаре Яким первым делом спасал <b>картинки</b>, а скопленные 35 рублей расплавились в комок."],
["t","Даже в нищете мужик тянется к красоте — эту деталь учителя любят спрашивать."],
["q","Что Яким Нагой спасал на пожаре в первую очередь?",["Деньги","Картинки","Иконы"],1,"Картинки. А 35 рублей сплавились в комок — за него потом дали всего 11 рублей."],

["h","Глава IV. Счастливые"],
["t","На людной площади странники с ведром водки объявляют: кто докажет, что счастлив, — того угостим."],
["t","Приходит <b>дьячок</b>: счастье, мол, в благодушии да в шкалике водки. Его прогоняют ни с чем."],
["t","<b>Старуха</b> хвалится: у неё на грядке уродилась крупная репа. Над ней смеются."],
["t","<b>Солдат с медалями</b>: в двадцати сражениях был — не убит, били палками — выжил, голодал — не умер. Ему наливают."],
["t","<b>Каменотёс-олончанин</b> хвалится силой. Ему отвечает мужик с одышкой: сам когда-то хвастал силой, надорвался и теперь едет умирать домой."],
["q","Чем «счастлив» солдат?",["У него большая пенсия","Он прошёл войны и остался жив","Его отпустили домой богатым"],1,"Его «счастье» — просто выжить. Это и есть горькое «мужицкое счастье»."],
["t","<b>Бывший дворовый</b> князя Переметьева гордится, что был «любимым рабом» и от барских объедков нажил подагру — «благородную» болезнь. Его прогоняют."],
["t","<b>Белорус</b> счастлив, что теперь ест вдоволь хлеба — раньше жевал хлеб с мякиной."],
["t","Ведро пустеет, а настоящих счастливых нет. Мужики подводят итог:","Эй, счастие мужицкое!\nДырявое с заплатами,\nГорбатое с мозолями,\nПроваливай домой!"],
["t","Из толпы советуют: ищите <b>Ермила Гирина</b> — вот кто счастлив."],
["t","Ермил — честный человек: был писарем, потом мир выбрал его <b>бурмистром</b> (управляющим из крестьян). Судил по правде, денег не брал."],
["q","Почему прогнали бывшего дворового?",["Он украл водку","Он гордился своим рабством и «барской» болезнью","Он не захотел пить"],1,"Он считает счастьем быть любимым рабом барина. Для странников это позор, а не счастье."],
["t","История с мельницей: её продавали с торгов, соперник — купец Алтынников. Ермилу срочно нужна была тысяча рублей."],
["t","Ермил прямо на базарной площади попросил денег у народа — и люди сразу собрали ему нужную сумму."],
["t","Через неделю Ермил вернул долг всем до копейки. Остался лишний рубль, хозяин не нашёлся — Ермил отдал его нищим."],
["t","Был у Ермила и грех: он выгородил младшего брата от рекрутчины, отдав в солдаты сына вдовы Ненилы Власьевны. Потом раскаялся, чуть не повесился и добился, чтобы парня вернули."],
["t","Кажется, у Ермила есть всё: покой, богатство, честь. Но рассказчик добавляет: Ермил <b>сидит в остроге</b> — его связали с бунтом в вотчине помещика Обрубкова."],
["t","Вывод: даже честный и уважаемый человек на Руси не защищён. Счастье Ермила — правда и уважение народа, но и его настигает беда."],

  let h=`<section class="hero"><h2>Кому на Руси жить хорошо</h2>
  <p class="lead">Н. А. Некрасов · вся поэма в ${TOTAL} тезисах</p>
  <div class="card"><p><b>О чём поэма.</b> Семь мужиков спорят, кому на Руси живётся хорошо, и отправляются искать счастливого человека. Время — первые годы после отмены крепостного права (1861). По дороге они встречают попа, помещика, крестьян, слушают их истории — и так перед нами проходит жизнь всего народа.</p>
  <p style="margin:0"><b>Как заниматься.</b> Выберите главу. Тезисы появляются по одному — прочитали, нажали «Дальше». Иногда будет вопрос: ответьте, чтобы идти дальше. Цитаты выделены — их полезно знать для ответа у доски. Прогресс сохраняется на этом устройстве.</p></div>
  <p class="note">Порядок частей — как в большинстве изданий. В некоторых учебниках «Крестьянка» стоит перед «Последышем».</p></section>`;
  PARTS.forEach(p=>{
    h+=`<div class="part-head">${p.title}<small>${p.sub} · тезисы ${p.first}–${p.last}</small></div><div class="parts">`;
    p.ch.forEach(c=>{
      const pr=Math.round(chProg(c)*100);
      h+=`<button class="part-btn ch-btn" data-c="${c.idx}"><span><b>${c.title}</b><small>тезисы ${c.from}–${c.to}</small></span><em class="${isDone(c)?"ok":""}">${isDone(c)?"✓":(pr?pr+"%":"")}</em></button>`;
    });
    h+=`</div>`;
  });
  main.innerHTML=h;
  main.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>openCh(+b.dataset.c,"top"));
  drawer();window.scrollTo(0,0);
}

function itemHTML(x,c,isLast){
  if(x.k==="t")return `<div class="th" id="i_${x.n}"><div class="num">${x.n}</div><div class="tx">${x.txt}${x.quote?`<div class="quote">${esc(x.quote)}</div>`:""}</div></div>`;
  const a=S.ans[x.id],answered=a!==undefined;
  let h=`<div class="quiz" id="${x.id}"><div class="lbl">Проверь себя</div><div class="q">${x.q}</div>`;
  x.opts.forEach((o,i)=>{let cls="";if(answered){if(i===x.a)cls="ok";else if(i===a)cls="bad";}
    h+=`<button class="opt ${cls}" data-q="${x.id}" data-i="${i}" ${answered?"disabled":""}>${o}</button>`;});
  if(answered)h+=`<div class="fb ${a===x.a?"ok":"bad"}"><b>${a===x.a?"Верно!":"Не совсем."}</b> ${x.ex}</div>`;
  return h+`</div>`;
}

function openCh(i,mode){
  cur=i;const c=CH[i],p=PARTS[c.pi];
  $("#topTitle").textContent=p.title+" · "+c.title;
  const r=rev(c);
  let h=`<div class="crumb">${p.title}</div><h3 class="chap first">${c.title}</h3>`;
  for(let k=0;k<r;k++)h+=itemHTML(c.items[k],c,k===r-1);
  if(isDone(c)){
    h+=`<div class="done">Глава прочитана ✓</div><div class="navrow">`+
      (i>0?`<button class="sec" id="prevCh">← ${CH[i-1].title}</button>`:"")+
      (i<CH.length-1?`<button class="primary" id="nextCh">${CH[i+1].pi!==c.pi?PARTS[CH[i+1].pi].title+": ":""}${CH[i+1].title} →</button>`:`<button class="primary" id="toHome">Вся поэма пройдена — на главную</button>`)+`</div>`;
  }
  main.innerHTML=h;
  $("#bar").style.width=(chProg(c)*100)+"%";
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.q,+b.dataset.i));
  const pv=$("#prevCh");if(pv)pv.onclick=()=>openCh(i-1,"top");
  const nx=$("#nextCh");if(nx)nx.onclick=()=>openCh(i+1,"top");
  const th=$("#toHome");if(th)th.onclick=home;
  bottom(c);drawer();
  const lastEl=main.querySelector(".th:last-of-type, .quiz:last-of-type")&&[...main.querySelectorAll(".th,.quiz")].pop();
  if(mode==="top")window.scrollTo(0,0);
  if(mode==="last"&&lastEl)lastEl.scrollIntoView({behavior:"smooth",block:"center"});
}

function bottom(c){
  const r=rev(c),last=c.items[r-1];
  const b=$("#bottom"),btn=$("#moreBtn");
  if(isDone(c)){hideBottom();return;}
  b.style.display="block";
  if(last.k==="q"&&S.ans[last.id]===undefined){btn.disabled=true;btn.textContent="Ответьте на вопрос";}
  else if(r<c.items.length){btn.disabled=false;btn.textContent=c.items[r].k==="q"?"Дальше: вопрос ↓":"Дальше ↓";}
  else hideBottom();
}
function hideBottom(){$("#bottom").style.display="none";}
$("#moreBtn").onclick=()=>{
  const c=CH[cur];const r=rev(c);if(r>=c.items.length)return;
  S.rev[c.id]=r+1;save();openCh(cur,"last");
};
function answer(id,i){
  if(S.ans[id]!==undefined)return;S.ans[id]=i;save();
  const y=window.scrollY;openCh(cur,"keep");window.scrollTo(0,y);
}

function drawer(){
  let h=`<button class="icon-btn" id="dHome" style="width:100%">⌂ Главная</button>`;
  PARTS.forEach(p=>{h+=`<h3>${p.title}</h3>`;
    p.ch.forEach(c=>h+=`<a href="#" data-c="${c.idx}" class="${cur===c.idx?"cur":""}">${c.title}${isDone(c)?" ✓":""}</a>`);});
  h+=`<button class="reset" id="reset">Сбросить прогресс</button><p class="note" id="resetNote"></p>`;
  const d=$("#drawer");d.innerHTML=h;
  d.querySelectorAll("a[data-c]").forEach(a=>a.onclick=e=>{e.preventDefault();closeD();openCh(+a.dataset.c,"top");});
  $("#dHome").onclick=()=>{closeD();home();};
  let armed=false;
  $("#reset").onclick=()=>{if(!armed){armed=true;$("#resetNote").textContent="Нажмите ещё раз, чтобы стереть все ответы.";return;}
    S={rev:{},ans:{}};save();closeD();home();};
}
function closeD(){document.body.classList.remove("open");}
$("#menuBtn").onclick=()=>document.body.classList.toggle("open");
$("#drawerBg").onclick=closeD;
$("#homeBtn").onclick=home;
home();
</script>
</body>
</html>
