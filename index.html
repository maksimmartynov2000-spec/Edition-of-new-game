<title>Общество · планы</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --card2:#f7f7fa; --text:#000; --sub:#6b6b73; --sep:rgba(60,60,67,.14);
  --accent:#5e5ce6; --accent-soft:rgba(94,92,230,.12); --green:#30c759; --red:#ff3b30; --orange:#ff9500;
  --hl:rgba(196,245,60,.75); --bar:rgba(249,249,251,.82); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --r:18px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --text:#fff; --sub:#98989f; --sep:rgba(84,84,88,.5);
  --accent:#7d7aff; --accent-soft:rgba(125,122,255,.18); --hl:rgba(170,220,30,.45); --bar:rgba(22,22,24,.82); --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{font:inherit;user-select:text;-webkit-user-select:text}
mark{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);color:inherit;padding:0 .15em;border-radius:3px}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .45s ease, transform .45s ease}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .ic{width:112px;height:112px;border-radius:26px;box-shadow:0 18px 40px rgba(94,92,230,.35);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash h1{margin-top:22px;font-size:28px;font-weight:700;letter-spacing:-.5px;animation:up .6s .15s both}
#splash p{color:var(--sub);margin-top:4px;font-size:15px;animation:up .6s .25s both}
#splash .ld{margin-top:34px;width:120px;height:4px;border-radius:2px;background:var(--sep);overflow:hidden;animation:up .6s .3s both}
#splash .ld i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;animation:load 1.3s .35s ease-in-out forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{to{width:100%}}

/* ---------- layout ---------- */
#tabs{position:fixed;inset:0;}
.tab{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px);display:none}
.tab.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.large{font-size:34px;font-weight:800;letter-spacing:-.8px;margin:18px 4px 4px}
.subtle{color:var(--sub);font-size:15px;margin:0 4px 18px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--sub);margin:26px 16px 8px}
.group{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;width:100%;text-align:left}
.row+.row:before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--sep)}
.row.nl+.row.nl:before{left:16px}
.row:active{background:var(--card2)}
.row .num{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--accent)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:16px}
.row .tx small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.chev{flex:none;width:8px;height:14px;opacity:.35}
.mini{height:4px;border-radius:2px;background:var(--sep);margin-top:7px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .5s}

/* tab bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:7px 6px calc(var(--safe-b) + 6px);background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
#bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--sub);padding:2px 0}
#bar button svg{width:26px;height:26px}
#bar button.on{color:var(--accent)}

/* home */
.hero{background:linear-gradient(135deg,#5e5ce6,#8c3cc8);color:#fff;border-radius:24px;padding:20px;display:flex;align-items:center;gap:18px;box-shadow:0 14px 30px rgba(94,92,230,.28)}
.hero .ring{flex:none;width:92px;height:92px;position:relative}
.hero .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.hero h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.hero p{opacity:.85;font-size:14px;margin-top:4px}
.big{display:block;width:100%;margin-top:14px;padding:16px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;text-align:center;box-shadow:0 8px 18px rgba(94,92,230,.3);transition:transform .12s}
.big:active,.tile:active,.btn:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);transition:transform .12s;display:flex;flex-direction:column;gap:10px;min-height:128px}
.tile .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px}
.tile b{font-size:16px;font-weight:700}
.tile small{color:var(--sub);font-size:13px;line-height:1.3;margin-top:-6px}
.tile.wide{flex-direction:row;align-items:center;min-height:0;width:100%;margin-top:12px;gap:14px}
.tile.wide>div:nth-child(2){flex:1;display:flex;flex-direction:column;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);min-width:64px;text-align:center;transition:all .3s}
.timer.warn{background:rgba(255,59,48,.14);color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
textarea.exam{min-height:52vh}
.grade{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:6px 0 14px}
.grade .g{flex:none;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff}
.grade b{font-size:18px;display:block}
.grade small{color:var(--sub);font-size:14px;display:block;margin-top:3px}
.res .subl{display:block;padding:0;background:none;margin:-3px 0 9px 26px}
.res .subl div{padding:7px 10px;font-size:14.5px;margin-bottom:5px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;color:#fff;margin-left:6px;vertical-align:2px}
.step .num{background:var(--card2);color:var(--sub)}
.step.cur .num{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.step.ok .num{background:var(--green);color:#fff}
.step.ok b{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sep)}
#splash.fast .ld i{animation-duration:.5s}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);z-index:200;transform:translate(-50%,-140%);background:rgba(30,30,32,.92);color:#fff;padding:11px 18px;border-radius:22px;font-size:14.5px;font-weight:500;transition:transform .35s cubic-bezier(.3,.9,.3,1);max-width:90vw;text-align:center;backdrop-filter:blur(10px)}
#toast.on{transform:translate(-50%,0)}
.link{color:var(--accent);font-size:15px;padding:14px;display:block;margin:10px auto 0;text-align:center}
.link.danger{color:var(--red)}

/* pages (push) */
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(var(--safe-t) + 54px) 16px calc(var(--safe-b) + 40px);transform:translateX(100%);transition:transform .38s cubic-bezier(.3,.9,.3,1)}
.page.in{transform:none}
.nav{position:fixed;top:0;left:0;right:0;z-index:31;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 8px) 10px 8px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);transform:translateX(100%);transition:transform .38s cubic-bezier(.3,.9,.3,1)}
.nav.in{transform:none}
.nav .back{color:var(--accent);display:flex;align-items:center;gap:4px;font-size:17px;padding:6px}
.nav .ttl{font-weight:600;font-size:16px;position:absolute;left:90px;right:90px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.nav .act{color:var(--accent);font-size:15px;padding:6px}
.pt{padding:14px 16px}
.pt+.pt{border-top:.5px solid var(--sep)}
.pt>b{display:flex;gap:8px;font-weight:600}
.pt>b em{font-style:normal;color:var(--accent);flex:none}
.pt ul{list-style:none;margin:8px 0 0 22px;transition:filter .25s,opacity .25s}
.pt li{padding:3px 0;color:var(--text);font-size:15.5px;display:flex;gap:6px}
.pt li em{font-style:normal;color:var(--sub);flex:none}
.hidden-sub .pt ul{filter:blur(7px);opacity:.55}
.hidden-sub .pt.open ul{filter:none;opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:11px 14px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px;transition:transform .12s}
.btn.solid{background:var(--accent);color:#fff}

/* notes */
.note{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.note .dt{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.3px}
.note h3{font-size:19px;margin:2px 0 10px;letter-spacing:-.2px}
.note .def{margin:8px 0;font-size:15.5px}
.note .lst{margin:10px 0}
.note .lst b{font-size:14px;color:var(--sub);font-weight:600;display:block;margin-bottom:3px}
.note .lst div{font-size:15.5px;padding:2px 0 2px 14px;position:relative}
.note .lst div:before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.note .tip{margin-top:10px;font-size:14px;color:var(--sub);background:var(--card2);padding:10px 12px;border-radius:12px}
.formula{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:700;margin:12px 0;font-size:17px}
.frac{display:inline-flex;flex-direction:column;align-items:center}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 6px 2px}
.frac span:last-child{padding:2px 6px 0}

/* sheet */
#dim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(var(--safe-b) + 18px);transform:translateY(105%);transition:transform .4s cubic-bezier(.3,.9,.3,1);max-height:88vh;overflow-y:auto}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
#sheet h3{font-size:22px;font-weight:700;margin:4px 4px 2px}
.tog{padding:10px 14px;border-radius:12px;background:var(--card);font-size:15px;font-weight:500;border:1.5px solid transparent;transition:all .15s}
.tog.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* trainer */
#tr{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .42s cubic-bezier(.3,.9,.3,1)}
#tr.on{transform:none}
.trh{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px}
.x{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.prog{flex:1;height:8px;border-radius:4px;background:var(--sep);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.cnt{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.trb{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column}
.trf{padding:10px 16px calc(var(--safe-b) + 14px);display:flex;gap:10px}
.trf .big{margin:0}
.kind{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);margin:6px 2px 6px}
.q{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.25;margin:0 2px 4px}
.qs{color:var(--sub);font-size:15px;margin:0 2px 16px}
.anim{animation:slide .35s cubic-bezier(.3,.9,.3,1)}
@keyframes slide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}

/* flashcard */
.fc{perspective:1200px;flex:1;min-height:340px;display:flex}
.fc-in{position:relative;flex:1;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:24px 22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow-y:auto}
.face.back{transform:rotateY(180deg)}
.face .q{font-size:24px}
.face .hint{margin-top:auto;color:var(--sub);font-size:14px;text-align:center;padding-top:16px}
.ans div{padding:7px 0;border-bottom:.5px solid var(--sep);font-size:16px;display:flex;gap:8px}
.ans div:last-child{border:0}
.ans em{font-style:normal;color:var(--accent);font-weight:700;flex:none;min-width:18px}
.no{background:rgba(255,59,48,.12)!important;color:var(--red)!important;box-shadow:none!important}
.yes{background:var(--green)!important;color:#fff!important;box-shadow:0 8px 18px rgba(48,199,89,.3)!important}

/* assemble */
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.slot{min-height:50px;border-radius:14px;border:1.5px dashed var(--sep);display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:15.5px;color:var(--sub);transition:all .2s}
.slot.f{border:1.5px solid transparent;background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.slot em{font-style:normal;font-weight:700;color:var(--accent);flex:none}
.slot.ok{background:rgba(48,199,89,.14);color:var(--text)}
.slot.bad{background:rgba(255,59,48,.12)}
.slot .fix{display:block;font-size:13px;color:var(--green);margin-top:3px}
.pool{display:flex;flex-direction:column;gap:8px}
.chip{padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:15.5px;text-align:left;transition:transform .12s,opacity .2s,background .2s;width:100%}
.chip:active{transform:scale(.98)}
.chip.used{opacity:.25;pointer-events:none}
.chip.sel{background:var(--accent);color:#fff}
.chip.ok{background:rgba(48,199,89,.16)}
.chip.bad{background:rgba(255,59,48,.14)}
.chip.miss{outline:2px solid var(--green);outline-offset:-2px}

/* memory */
textarea.mem{width:100%;min-height:190px;border:0;border-radius:16px;background:var(--card);color:var(--text);padding:14px;font-size:16px;line-height:1.5;resize:none;outline:none;box-shadow:var(--shadow)}
textarea.mem:focus{box-shadow:0 0 0 2px var(--accent)}
.res div{padding:10px 12px;border-radius:12px;margin-bottom:7px;font-size:15.5px;display:flex;gap:10px;align-items:flex-start}
.res .ok{background:rgba(48,199,89,.14)}
.res .bad{background:rgba(255,59,48,.10)}
.res i{font-style:normal;flex:none;font-weight:700}
.res small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.res button{margin-left:auto;font-size:13px;color:var(--accent);font-weight:600;flex:none}

/* toast / result */
.done{text-align:center;padding:30px 10px}
.done .em{font-size:64px;animation:pop .6s both}
.done h2{font-size:26px;margin-top:10px}
.done p{color:var(--sub);margin-top:6px}
.fb{border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:600;font-size:15px;animation:up .3s}
.fb.ok{background:rgba(48,199,89,.14);color:#1f9e45}
.fb.bad{background:rgba(255,59,48,.1);color:var(--red)}
@media (prefers-color-scheme:dark){.fb.ok{color:#5be080}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>

  G.push({id:'p'+pl.n, src:'plan', key:'p'+pl.n, title:pl.t, ctx:'План '+pl.n, items:pl.p.map(x=>x[0]), ordered:true, top:true});
  pl.p.forEach((x,i)=>{ if(x[1].length>=2) G.push({id:'p'+pl.n+'.'+(i+1), src:'plan', key:'p'+pl.n, title:x[0], ctx:'План '+pl.n+' · пункт '+(i+1), items:x[1], ordered:false}); });
});
SIGNS.forEach((s,i)=>G.push({id:'s'+i, src:'sign', key:'sign', title:s[0], ctx:'Признаки', items:s[1], ordered:false}));
NOTES.forEach((nt,ni)=>nt.b.forEach((b,bi)=>{
  if(b.l) G.push({id:'n'+ni+'.'+bi, src:'note', key:'note', title:b.l, ctx:'Конспект · '+nt.t, items:b.i, ordered:!!b.o});
  if(b.d) DEFS.push({id:'d'+ni+'.'+bi, src:'note', key:'note', term:b.d, x:b.x, ctx:'Конспект · '+nt.t});
}));
DEFS.push({id:'dform', src:'note', key:'note', term:'Формула самооценки', x:'Самооценка = Успех / Притязания', ctx:'Конспект · Самопознание'});

/* ===================== ХРАНИЛИЩЕ ===================== */
const LS='obsch-v1';
let S={box:{}, seen:0, streak:0};
try{ const r=localStorage.getItem(LS); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function mark(id,ok){ const b=S.box[id]||0; S.box[id]= ok? Math.min(3,b+1) : 0; S.seen++; save(); }
function mastery(ids){ if(!ids.length) return 0; let s=0; ids.forEach(id=>s+=(S.box[id]||0)); return s/(3*ids.length); }
const allIds=()=>G.map(g=>g.id).concat(DEFS.map(d=>d.id));
const planIds=n=>G.filter(g=>g.key==='p'+n).map(g=>g.id);

/* ===================== УТИЛИТЫ ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[^a-zа-я0-9\s-]/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set('и в во с со на по к ко от для а о об как т д др его ее их это то что из за при над под между же или не'.split(' '));
const stem=w=>w.length>=7?w.slice(0,5):w.slice(0,Math.max(3,w.length-2));
const stems=s=>norm(s).split(/[\s-]+/).filter(w=>w.length>2&&!STOP.has(w)).map(stem);
const same=(a,b)=>a.startsWith(b)||b.startsWith(a);
const hasStem=(arr,s)=>arr.some(x=>same(x,s));
// похожесть двух пунктов: доля общих основ от меньшего
function sim(a,b){ const A=[...new Set(stems(a))],B=[...new Set(stems(b))]; if(!A.length||!B.length) return 0; const k=A.filter(x=>hasStem(B,x)).length; return k/Math.min(A.length,B.length); }
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const CHEV='<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const LETTERS='абвгдеж';

/* ===================== ЭКРАНЫ ===================== */
function renderHome(){
  const ids=allIds(), m=mastery(ids), pct=Math.round(m*100);
  const weak=ids.filter(id=>id in S.box && S.box[id]===0).length;
  const ex=S.exam||{}, five=PLANS.filter(p=>ex[p.n]&&ex[p.n].g===5).length, good=PLANS.filter(p=>ex[p.n]&&ex[p.n].g>=4).length;
  const read=Object.keys(S.read||{}).length;
  const pm=mastery(G.filter(g=>g.src==='plan').map(g=>g.id));
  const hr=new Date().getHours(), morning=hr>=4&&hr<14, D=dayLog();
  const EVE=[
    {ok:read>=8, t:'Прочитать все 8 планов', s:`≈15 мин · открыто ${read} из 8`, a:"openPlan(0)"},
    {ok:pm>=.6, t:'Тренировка планов: 2–3 подхода', s:`≈20 мин · выучено ${Math.round(pm*100)}%, цель 60%`, a:"openSetup('mix',{plans:true})"},
    {ok:good>=8, t:'Экзамен по всем 8 планам', s:`≈30 мин · на 4–5 сдано ${good} из 8`, a:"examAll()"},
    {ok:good>=8&&!weak, t:'Перед сном: повторить ошибки', s:weak?`≈5 мин · на повтор ${weak}`:'≈5 мин · сон закрепит выученное', a:"startWeak()"}
  ];
  const MOR=[
    {ok:!!D.m1, t:'Утренний прогон', s:'≈7 мин · вспомнить пункты всех 8 планов', a:"startMorning()"},
    {ok:!!D.m2, t:'Мини-экзамен: 3 самых слабых плана', s:'≈10 мин · по 3 минуты', a:"morningExam()"},
    {ok:!!D.m3, t:'Перед уроком: шпаргалка', s:'≈3 мин · пробежать глазами все планы', a:"openPlan(0)"}
  ];
  const stepList=(arr,active)=>{ const cur=active?arr.findIndex(x=>!x.ok):-1;
    return `<div class="group">${arr.map((x,i)=>`<button class="row step ${x.ok?'ok':''} ${i===cur?'cur':''}" onclick="${x.a}"><div class="num">${x.ok?'✓':i+1}</div><div class="tx"><b>${x.t}</b><small>${x.s}</small></div>${CHEV}</button>`).join('')}</div>`; };
  const steps=morning?MOR:EVE, cur=steps.findIndex(x=>!x.ok);
  const C=2*Math.PI*40;
  $('#t-home').innerHTML=`
   <div class="large">Сегодня</div>
   <div class="subtle">Тест по обществознанию · планы</div>
   <div class="hero">
     <div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" stroke="rgba(255,255,255,.25)" stroke-width="9" fill="none"/>
       <circle cx="46" cy="46" r="40" stroke="#c4f53c" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-m)}" style="transition:stroke-dashoffset 1s"/></svg><span>${pct}%</span></div>
     <div><h2>${cur<0?(pct>=60?(morning?'Готов к тесту! 🎉':'На сегодня всё — спать! 🌙'):'Шаги пройдены — добей ошибки'):morning?'Доброе утро! Освежим':pct<30?'Начнём с планов':pct<70?'Хороший темп':'Почти готово!'}</h2><p>Готовность к тесту${five?` · на «5» сдано ${five} из 8`:''}</p></div>
   </div>
   <div class="sec">${morning?'Утром перед тестом · ≈20 мин':'Сегодня вечером · ≈1 ч 10 мин'}</div>
   ${stepList(steps,true)}
   <div class="sec">${morning?'Вечер (если не успели)':'Завтра утром · ≈20 мин'}</div>
   ${stepList(morning?EVE:MOR,false)}
   ${weak?`<button class="big" style="background:var(--orange);box-shadow:0 8px 18px rgba(255,149,0,.3)" onclick="startWeak()">↻ Повторить ошибки (${weak})</button>`:''}
   <div class="sec">Тренировка</div>
   <button class="tile wide" style="margin-top:0;margin-bottom:12px" onclick="openSetup('mix')"><div class="ti" style="background:rgba(94,92,230,.14)">⚡️</div><div><b>Быстрая тренировка</b><small>Все режимы вперемешку</small></div>${CHEV}</button>
   <div class="grid">
     ${tile('cards','🃏','Карточки','Вспомни, переверни, оцени себя','rgba(94,92,230,.14)')}
     ${tile('build','🧩','Собрать план','Расставь пункты по порядку','rgba(255,149,0,.16)')}
     ${tile('mem','✍️','По памяти','Напиши пункты — проверю','rgba(48,199,89,.16)')}
     ${tile('odd','🔍','Лишний пункт','Найди то, что не отсюда','rgba(255,59,48,.13)')}
   </div>
   <button class="tile wide" onclick="openExamSetup()"><div class="ti" style="background:rgba(140,60,200,.15)">⏱</div><div><b>Экзамен</b><small>План целиком по памяти, на время, с оценкой</small></div>${CHEV}</button>
   <button class="link danger" id="rst" onclick="resetP(this)">Сбросить прогресс</button>`;
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dayLog(){ S.day=S.day||{}; return S.day[today()]||(S.day[today()]={}); }
function logDay(k){ dayLog()[k]=1; save(); }
// планы с худшей подготовкой — первыми
function weakestPlans(){ return shuffle(PLANS.map(p=>p.n)).sort((a,b)=>{ const sa=(S.exam&&S.exam[a]?S.exam[a].p:-1)+mastery(planIds(a))*50, sb=(S.exam&&S.exam[b]?S.exam[b].p:-1)+mastery(planIds(b))*50; return sa-sb; }); }
function examAll(){ runExam(weakestPlans(),240); }
function morningExam(){ runExam(weakestPlans().slice(0,3),180,'m2'); }
function startMorning(){
  const tops=shuffle(G.filter(g=>g.top)).map(g=>makeTask('cards',g));
  const ids=new Set(allIds().filter(id=>id in S.box && S.box[id]===0 && !id.match(/^p\d$/)));
  const weak=shuffle(G.filter(g=>ids.has(g.id)&&g.src==='plan')).slice(0,6).map(g=>makeTask(pick(['build','odd','mem'].filter(m=>modeFits(m,g))),g));
  runSession(tops.concat(weak),'m1');
}
function goTab(t){ document.querySelector(`#bar button[data-t="${t}"]`).click(); }
function tile(mode,ic,t,s,bg){return `<button class="tile" onclick="openSetup('${mode}')"><div class="ti" style="background:${bg}">${ic}</div><b>${t}</b><small>${s}</small></button>`}
function planRow(pl){
  const m=mastery(planIds(pl.n));
  return `<button class="row" onclick="openPlan(${pl.n})"><div class="num" style="background:${m>=.67?'var(--green)':m>0?'var(--orange)':'var(--accent)'}">${pl.n}</div>
   <div class="tx"><b>${esc(pl.t)}${S.exam&&S.exam[pl.n]?`<span class="badge" style="background:${GC[S.exam[pl.n].g]}">${S.exam[pl.n].g}</span>`:''}</b><div class="mini"><i style="width:${Math.round(m*100)}%"></i></div></div>${CHEV}</button>`;
}
function exText(n){ return S.exam&&S.exam[n]?'Лучшая оценка: '+S.exam[n].g+' ('+S.exam[n].p+'%) · 5 минут':'5 минут, весь план по памяти'; }
let rstT=0;
function resetP(el){ if(Date.now()-rstT<2500){ S={box:{},seen:0,streak:0,exam:{},read:{}}; save(); renderAll(); toast('Прогресс сброшен'); } else { rstT=Date.now(); el.textContent='Нажмите ещё раз для сброса'; setTimeout(()=>{ if(el.isConnected) el.textContent='Сбросить прогресс'; },2500);} }

function renderPlans(){
  $('#t-plans').innerHTML=`<div class="large">Планы</div><div class="subtle">Полоска — насколько выучен план, значок — лучшая оценка на экзамене.</div>
   <button class="tile wide" style="margin:0 0 12px" onclick="openPlan(0)"><div class="ti" style="background:rgba(196,245,60,.35)">📄</div><div><b>Все планы на одной странице</b><small>Прочитать подряд или проверить себя</small></div>${CHEV}</button>
   <div class="group">${PLANS.map(planRow).join('')}</div>
   <button class="big" onclick="openSetup('mix',{plans:true})">Тренировать все планы</button>
   <button class="link" onclick="openExamSetup()">⏱ Экзамен по планам →</button>`;
}
function renderSigns(){
  $('#t-signs').innerHTML=`<div class="large">Признаки</div><div class="subtle">Дополнительно — если останется время. Главное к тесту — планы.</div>
   <div class="group">${SIGNS.map((s,i)=>`<button class="row nl" onclick="toggleSign(this,${i})" style="flex-wrap:wrap">
     <div class="tx"><b>${esc(s[0])}</b><small>${s[1].length} ${s[1].length>4?'признаков':'признака'}</small></div>${CHEV}
     <div class="ans" style="display:none;width:100%;margin-top:6px">${s[1].map((x,j)=>`<div><em>${j+1}</em>${esc(x)}</div>`).join('')}</div></button>`).join('')}</div>
   <button class="big" onclick="startSession('cards',{sign:true})">Карточки по признакам</button>
   <button class="link" onclick="openSetup('mix',{sign:true})">Другие режимы →</button>`;
}
function toggleSign(el){ const a=el.querySelector('.ans'), o=a.style.display==='none'; a.style.display=o?'block':'none'; el.querySelector('.chev').style.transform=o?'rotate(90deg)':''; }
function renderNotes(){
  $('#t-notes').innerHTML=`<div class="large">Конспект</div><div class="subtle">Тетрадь начисто. Дополнительно — главное к тесту планы.</div>
   ${NOTES.map(nt=>`<div class="note"><div class="dt">${esc(nt.dt)}</div><h3>${esc(nt.t)}</h3>${nt.b.map(b=>{
     if(b.d) return `<div class="def"><mark>${esc(b.d)}</mark> — ${esc(b.x)}</div>`;
     if(b.l) return `<div class="lst"><b>${esc(b.l)}</b>${b.i.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
     if(b.n) return `<div class="tip">${esc(b.n)}</div>`;
     if(b.f) return `<div class="formula">Самооценка = <span class="frac"><span>Успех</span><span>Притязания</span></span></div>`;
     return '';}).join('')}</div>`).join('')}
   <button class="big" onclick="startSession('cards',{note:true})">Карточки по конспекту</button>
   <button class="link" onclick="openSetup('mix',{note:true})">Другие режимы →</button>`;
}
function renderAll(){ renderHome(); renderPlans(); renderSigns(); renderNotes();
  document.querySelectorAll('.page[data-plan]').forEach(p=>{ const e=p.querySelector('#exs'); if(e) e.textContent=exText(+p.dataset.plan); }); }

/* tabs */
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#bar button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.t));
  $('#t-'+b.dataset.t).scrollTop=0; buzz(5);
});

/* ===================== СТРАНИЦА ПЛАНА ===================== */
function planHTML(pl){ return pl.p.map((x,i)=>`<div class="pt"><b><em>${i+1}.</em>${esc(x[0])}</b>${x[1].length?`<ul>${x[1].map((y,j)=>`<li><em>${LETTERS[j]})</em>${esc(y)}</li>`).join('')}</ul>`:''}</div>`).join(''); }
function openPlan(n){
  S.read=S.read||{};
  if(n===0){ PLANS.forEach(p=>S.read[p.n]=1); if(new Date().getHours()>=4&&new Date().getHours()<14) dayLog().m3=1; }
  else S.read[n]=1;
  save(); renderHome();
  const pl=PLANS[n-1];
  const nav=document.createElement('div'); nav.className='nav';
  nav.innerHTML=`<button class="back"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Назад</button><div class="ttl">${n?'План '+n:'Все планы'}</div><button class="act">Скрыть</button>`;
  const pg=document.createElement('div'); pg.className='page';
  if(!n){
    pg.innerHTML=`<div class="q" style="font-size:26px;margin-top:6px">Все 8 планов</div><div class="qs">Читай вслух. «Скрыть» — размыть подпункты и проверять себя: нажми на пункт, чтобы открыть.</div>
     <div id="pbody">${PLANS.map(p=>`<div class="kind" style="margin-top:20px">План ${p.n}</div><div style="font-weight:700;font-size:19px;margin:0 2px 10px">${esc(p.t)}</div><div class="group">${planHTML(p)}</div>`).join('')}</div>
     <button class="big" style="margin-top:22px" onclick="openSetup('mix',{plans:true})">Тренировать</button>`;
  } else {
  pg.innerHTML=`<div class="kind" style="margin-top:6px">План ${n}</div><div class="q" style="font-size:26px">${esc(pl.t)}</div>${pl.s?`<div class="qs">${esc(pl.s)}</div>`:'<div style="height:14px"></div>'}
   <div class="group" id="pbody">${planHTML(pl)}</div>
   <div class="sec">Учить этот план</div>
   <div class="grid">
     <button class="tile" data-m="cards"><div class="ti" style="background:rgba(94,92,230,.14)">🃏</div><b>Карточки</b></button>
     <button class="tile" data-m="build"><div class="ti" style="background:rgba(255,149,0,.16)">🧩</div><b>Собрать</b></button>
     <button class="tile" data-m="mem"><div class="ti" style="background:rgba(48,199,89,.16)">✍️</div><b>По памяти</b></button>
     <button class="tile" data-m="odd"><div class="ti" style="background:rgba(255,59,48,.13)">🔍</div><b>Лишний</b></button>
   </div>
   <button class="tile wide" id="exb"><div class="ti" style="background:rgba(140,60,200,.15)">⏱</div><div><b>Экзамен по этому плану</b><small id="exs">${exText(n)}</small></div>${CHEV}</button>`;
  }
  document.body.append(pg,nav);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{pg.classList.add('in');nav.classList.add('in')}));
  const close=()=>{pg.classList.remove('in');nav.classList.remove('in');setTimeout(()=>{pg.remove();nav.remove()},400)};
  nav.querySelector('.back').onclick=close;
  const act=nav.querySelector('.act'), body=pg.querySelector('#pbody');
  act.onclick=()=>{ const h=body.classList.toggle('hidden-sub'); act.textContent=h?'Показать':'Скрыть'; body.querySelectorAll('.pt').forEach(p=>p.classList.remove('open')); };
  body.querySelectorAll('.pt').forEach(p=>p.onclick=()=>p.classList.toggle('open'));
  pg.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startSession(b.dataset.m,{plans:[n]}));
  if(n) pg.querySelector('#exb').onclick=()=>runExam([n],300);
  if(n) pg.dataset.plan=n;
  // свайп назад от левого края
  let sx=null; pg.addEventListener('touchstart',e=>{const x=e.touches[0].clientX; sx=x<30?x:null},{passive:true});
  pg.addEventListener('touchend',e=>{ if(sx!==null && e.changedTouches[0].clientX-sx>80) close(); sx=null; });
}

/* ===================== НАСТРОЙКА СЕССИИ (шторка) ===================== */
const MODE_NAMES={mix:'Быстрая тренировка',cards:'Карточки',build:'Собрать план',odd:'Лишний пункт',mem:'По памяти'};
function openSetup(mode,pre){
  pre=pre||{};
  let sel={plans:new Set(), sign:false, note:false};
  if(pre.plans===true||(!pre.sign&&!pre.note&&!pre.plans)) PLANS.forEach(p=>sel.plans.add(p.n));
  else if(Array.isArray(pre.plans)) pre.plans.forEach(n=>sel.plans.add(n));
  if(pre.sign) sel.sign=true; if(pre.note) sel.note=true;
  let len=mode==='cards'?20:12;
  const sh=$('#sheet');
  const draw=()=>{
    sh.innerHTML=`<div class="grab"></div><h3>${MODE_NAMES[mode]}</h3><div class="subtle" style="margin-bottom:14px">${mode==='mix'?'Все режимы вперемешку — как будто не знаешь формат теста':'Что тренируем?'}</div>
     <div class="sec" style="margin-top:4px">Планы <button style="float:right;color:var(--accent);text-transform:none;font-size:13px" id="allp">${sel.plans.size===8?'Снять все':'Выбрать все'}</button></div>
     <div class="chips">${PLANS.map(p=>`<button class="tog ${sel.plans.has(p.n)?'on':''}" data-p="${p.n}">${p.n}. ${esc(p.t.length>22?p.t.slice(0,21)+'…':p.t)}</button>`).join('')}</div>
     <div class="sec">Ещё</div>
     <div class="chips"><button class="tog ${sel.sign?'on':''}" data-x="sign">Признаки</button><button class="tog ${sel.note?'on':''}" data-x="note">Конспект</button></div>
     <div class="sec">Сколько вопросов</div><div class="seg">${[8,12,20,0].map(v=>`<button data-l="${v}" class="${len===v?'on':''}">${v||'Все'}</button>`).join('')}</div>
     <button class="big" id="go" style="margin-top:22px">Начать</button>`;
    sh.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=+b.dataset.p; sel.plans.has(n)?sel.plans.delete(n):sel.plans.add(n); buzz(5); draw();});
    sh.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{sel[b.dataset.x]=!sel[b.dataset.x]; buzz(5); draw();});
    sh.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{len=+b.dataset.l; draw();});
    sh.querySelector('#allp').onclick=()=>{ if(sel.plans.size===8) sel.plans.clear(); else PLANS.forEach(p=>sel.plans.add(p.n)); draw(); };
    sh.querySelector('#go').onclick=()=>{
      if(!sel.plans.size&&!sel.sign&&!sel.note){ sh.querySelector('#go').classList.add('shake'); setTimeout(()=>sh.querySelector('#go')&&sh.querySelector('#go').classList.remove('shake'),400); return; }
      closeSheet(); startSession(mode,{plans:[...sel.plans],sign:sel.sign,note:sel.note,len});
    };
  };
  draw(); $('#dim').classList.add('on'); sh.classList.add('on');
}

$('#dim').onclick=closeSheet;

/* ===================== ГЕНЕРАЦИЯ ЗАДАНИЙ ===================== */
function poolFor(f){
  const keys=new Set((f.plans||[]).map(n=>'p'+n)); if(f.sign) keys.add('sign'); if(f.note) keys.add('note');
  return {groups:G.filter(g=>keys.has(g.key)), defs:DEFS.filter(d=>keys.has(d.key))};
}
function intruderFor(g,avoid){
  avoid=avoid||[];
  const src=G.filter(x=>x.src===g.src && x.id!==g.id && x.title!==g.title && !!x.top===!!g.top);
  const pool=(src.length?src:G.filter(x=>x.id!==g.id)).flatMap(x=>x.items);
  const okc=c=>!g.items.some(it=>sim(it,c)>=.5) && !avoid.includes(c) && !sim(g.title,c);
  const cands=shuffle(pool).filter(okc);
  if(cands.length) return cands[0];
  return shuffle(G.flatMap(x=>x.items)).find(okc)||'классовая борьба';
}
function makeTask(mode,obj){
  if(obj.term) return {mode:'cards',def:obj,id:obj.id};
  const g=obj;
  if(mode==='odd'){
    const shown=shuffle(g.items).slice(0,Math.min(4,g.items.length));
    const extra=intruderFor(g);
    return {mode,g,id:g.id,opts:shuffle(shown.concat([extra])),extra};
  }
  if(mode==='build'){
    if(g.ordered) return {mode,g,id:g.id,kind:'order',opts:shuffle(g.items)};
    const ds=[]; ds.push(intruderFor(g)); ds.push(intruderFor(g,ds));
    return {mode,g,id:g.id,kind:'pick',opts:shuffle(g.items.concat(ds)),ds};
  }
  return {mode,g,id:g.id};
}
function modeFits(mode,o){
  if(o.term) return mode==='cards';
  if(mode==='odd') return o.items.length>=2;
  if(mode==='build') return o.items.length>=2;
  return true;
}
function startSession(mode,f){
  f=f||{}; if(!f.plans&&!f.sign&&!f.note) f.plans=PLANS.map(p=>p.n);
  const {groups,defs}=poolFor(f);
  let tasks=[];
  if(mode==='cards'){
    let objs=groups.concat(defs);
    // слабые и новые — вперёд
    objs=shuffle(objs).sort((a,b)=>(S.box[a.id]||0)-(S.box[b.id]||0));
    tasks=objs.map(o=>makeTask('cards',o));
    if(f.len) tasks=tasks.slice(0,f.len);
  } else {
    const modes=mode==='mix'?['cards','build','mem','odd']:[mode];
    let objs=shuffle(mode==='mix'?groups.concat(defs):groups).sort((a,b)=>(S.box[a.id]||0)-(S.box[b.id]||0)+(Math.random()-.5)*1.2);
    // планы целиком — в приоритете
    objs.sort((a,b)=>(b.top?1:0)-(a.top?1:0)+(Math.random()-.5)*1.4);
    for(const o of objs){
      const ms=modes.filter(m=>modeFits(m,o)); if(!ms.length) continue;
      tasks.push(makeTask(pick(ms),o));
    }
    if(f.len) tasks=tasks.slice(0,f.len);
  }
  if(!tasks.length){ return; }
  runSession(tasks, mode);
}
function startWeak(){
  const ids=new Set(allIds().filter(id=>id in S.box && S.box[id]===0));
  const objs=G.filter(g=>ids.has(g.id)).concat(DEFS.filter(d=>ids.has(d.id)));
  const tasks=shuffle(objs).map(o=>{ const ms=['cards','build','mem','odd'].filter(m=>modeFits(m,o)); return makeTask(pick(ms),o); });
  if(tasks.length) runSession(tasks,'weak'); else toast('Ошибок на повтор нет 👍');
}

let SES=null;
function runSession(tasks,mode){
  SES={tasks,i:0,ok:0,mode};
  const tr=$('#tr');
  tr.innerHTML=`<div class="trh"><button class="x" id="trx"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div class="prog"><i id="pg"></i></div><div class="cnt" id="cnt"></div></div><div class="trb" id="trb"></div><div class="trf" id="trf"></div>`;
  tr.classList.add('on');
  $('#trx').onclick=safeClose;
  showTask();
}
let xT=0;
function safeClose(){ if(EX&&EX.writing&&$('#ta')&&$('#ta').value.trim()&&Date.now()-xT>2500){ xT=Date.now(); toast('Ответ не сдан. Нажмите ✕ ещё раз, чтобы выйти'); return; } endSession(); }
function endSession(){ clearInterval(EXT); $('#tr').classList.remove('on'); SES=null; EX=null; renderAll(); }
function progress(){ $('#pg').style.width=(SES.i/SES.tasks.length*100)+'%'; $('#cnt').textContent=Math.min(SES.i+1,SES.tasks.length)+' / '+SES.tasks.length; }
function next(ok){
  const t=SES.tasks[SES.i]; mark(t.id,ok); if(ok) SES.ok++;
  SES.i++; if(SES.i>=SES.tasks.length) return finish(); showTask();
}
function finish(){
  if(SES.mode==='m1') logDay('m1');
  $('#pg').style.width='100%'; $('#cnt').textContent='';
  const r=SES.ok/SES.tasks.length;
  $('#trb').innerHTML=`<div class="done anim"><div class="em">${r>=.85?'🏆':r>=.6?'💪':'📚'}</div><h2>${SES.ok} из ${SES.tasks.length}</h2>
   <p>${r>=.85?'Отлично! Этот материал ты знаешь.':r>=.6?'Неплохо. Ошибки попадут в «Повторить ошибки».':'Ничего страшного — повтори ошибки ещё раз, станет легче.'}</p></div>`;
  $('#trf').innerHTML=`<button class="big" style="background:var(--card2);color:var(--text);box-shadow:none" onclick="endSession()">Готово</button>`+
   (SES.ok<SES.tasks.length?`<button class="big" onclick="redoWrong()">Ещё раз ошибки</button>`:'');
  buzz([10,40,10]);
}
function redoWrong(){
  const wrong=SES.tasks.filter(t=>(S.box[t.id]||0)===0);
  const fresh=wrong.map(t=>{ const o=t.def||t.g; return makeTask(t.mode,o); });
  if(fresh.length) runSession(fresh,SES.mode); else endSession();
}
function head(t,kind,q,qs){ return `<div class="kind">${kind}</div><div class="q">${esc(q)}</div><div class="qs">${qs}</div>`; }
function showTask(){
  progress();
  const t=SES.tasks[SES.i], b=$('#trb'), f=$('#trf');
  b.scrollTop=0; b.innerHTML=''; f.innerHTML='';
  ({cards:taskCard,build:taskBuild,mem:taskMem,odd:taskOdd})[t.mode](t,b,f);
  b.firstElementChild&&b.firstElementChild.classList.add('anim');
}

/* --- собрать --- */
function taskBuild(t,b,f){
  const g=t.g;
  if(t.kind==='order'){
    const placed=[];
    b.innerHTML=`<div>${head(t,esc(g.ctx),g.title,'Нажимай на пункты в правильном порядке. Нажми на заполненный слот, чтобы вернуть пункт.')}</div>
      <div class="slots" id="sl"></div><div class="pool" id="pl"></div>`;
    const draw=()=>{
      $('#sl').innerHTML=g.items.map((_,i)=>`<div class="slot ${placed[i]!=null?'f':''}" data-i="${i}"><em>${i+1}.</em><span>${placed[i]!=null?esc(t.opts[placed[i]]):''}</span></div>`).join('');
      $('#pl').innerHTML=t.opts.map((x,i)=>`<button class="chip ${placed.includes(i)?'used':''}" data-o="${i}">${esc(x)}</button>`).join('');
      $('#sl').querySelectorAll('.slot.f').forEach(s=>s.onclick=()=>{ placed.splice(+s.dataset.i,1); draw(); });
      $('#pl').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ placed.push(+c.dataset.o); buzz(5); draw(); if(placed.length===g.items.length) check(); });
    };
    const check=()=>{
      let ok=true;
      $('#sl').querySelectorAll('.slot').forEach((s,i)=>{ const good=t.opts[placed[i]]===g.items[i]; if(!good){ok=false; s.querySelector('span').innerHTML+=`<span class="fix">✓ ${esc(g.items[i])}</span>`;} s.classList.add(good?'ok':'bad'); s.onclick=null; });
      $('#pl').style.display='none';
      f.innerHTML=`<button class="big ${ok?'yes':''}" id="nx">${ok?'Верно! Дальше':'Понятно, дальше'}</button>`;
      if(!ok){ b.insertAdjacentHTML('beforeend',`<div class="fb bad">Порядок важен: на тесте пункты плана пишут в логичной последовательности.</div>`); buzz(30);} else buzz(10);
      $('#nx').onclick=()=>next(ok);
    };
    draw();
  } else {
    const chosen=new Set();
    b.innerHTML=`<div>${head(t,esc(g.ctx),g.title,`Выбери все верные подпункты (их ${g.items.length}). Есть 2 лишних.`)}</div><div class="pool" id="pl"></div>`;
    const draw=()=>{ $('#pl').innerHTML=t.opts.map((x,i)=>`<button class="chip ${chosen.has(i)?'sel':''}" data-o="${i}">${esc(x)}</button>`).join('');
      $('#pl').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const i=+c.dataset.o; chosen.has(i)?chosen.delete(i):chosen.add(i); buzz(5); draw(); upd();}); };
    const upd=()=>{ f.innerHTML=`<button class="big" id="ck" ${chosen.size?'':'style="opacity:.4"'}>Проверить</button>`; $('#ck').onclick=()=>chosen.size&&check(); };
    const check=()=>{
      let ok=true;
      $('#pl').querySelectorAll('.chip').forEach((c,i)=>{ const isRight=g.items.includes(t.opts[i]); c.classList.remove('sel'); c.onclick=null;
        if(chosen.has(i)&&isRight) c.classList.add('ok'); else if(chosen.has(i)&&!isRight){c.classList.add('bad');ok=false;} else if(isRight){c.classList.add('miss');ok=false;} else c.style.opacity='.35'; });
      b.insertAdjacentHTML('beforeend',`<div class="fb ${ok?'ok':'bad'}">${ok?'Всё верно!':'Зелёная рамка — пропущенный верный пункт, красный — лишний.'}</div>`);
      f.innerHTML=`<button class="big ${ok?'yes':''}" id="nx">Дальше</button>`; $('#nx').onclick=()=>next(ok); buzz(ok?10:30);
    };
    draw(); upd();
  }
}

/* --- по памяти --- */
function matchItems(items,text){
  const lines=text.split(/\n|;|,(?![^()]*\))/).map(s=>s.trim()).filter(Boolean);
  const ls=lines.map(stems), all=stems(text);
  return items.map(it=>{
    const k=[...new Set(stems(it))]; if(!k.length) return {it,ok:true};
    let best=0;
    ls.forEach(l=>{ best=Math.max(best,k.filter(s=>hasStem(l,s)).length); });
    const need=k.length<=2?1:Math.ceil(k.length*.5);
    if(best<need && k.length===1 && hasStem(all,k[0])) best=1;
    return {it,ok:best>=need};
  });
}
function taskMem(t,b,f){
  const g=t.g;
  b.innerHTML=`<div>${head(t,esc(g.ctx),g.title,`Напиши ${g.top?'пункты плана':'все пункты'} (${g.items.length}) — каждый с новой строки. Можно кратко, ключевыми словами.`)}</div>
   <textarea class="mem" id="ta" placeholder="1. …&#10;2. …" autocapitalize="sentences"></textarea>`;
  f.innerHTML=`<button class="big" id="ck">Проверить</button>`;
  $('#ck').onclick=()=>{
    const v=$('#ta').value; if(!v.trim()){ $('#ta').classList.add('shake'); setTimeout(()=>$('#ta')&&$('#ta').classList.remove('shake'),400); return; }
    const res=matchItems(g.items,v);
    const box=document.createElement('div'); box.className='res'; box.style.marginTop='16px';
    const draw=()=>{
      const n=res.filter(r=>r.ok).length;
      box.innerHTML=`<div class="kind" style="padding:0;background:none">Совпало ${n} из ${res.length}</div>`+res.map((r,i)=>`<div class="${r.ok?'ok':'bad'}"><i>${r.ok?'✓':'✗'}</i><span>${esc(r.it)}</span>${r.ok?'':`<button data-a="${i}">Засчитать</button>`}</div>`).join('');
      box.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{res[+x.dataset.a].ok=true; draw(); foot();});
    };
    const foot=()=>{ const ok=res.every(r=>r.ok); f.innerHTML=`<button class="big ${ok?'yes':''}" id="nx">${ok?'Отлично! Дальше':'Дальше'}</button>`; $('#nx').onclick=()=>next(ok); };
    $('#ta').readOnly=true; $('#ta').style.minHeight='0'; $('#ta').style.opacity='.7';
    b.append(box); draw(); foot();
    b.insertAdjacentHTML('beforeend',`<div class="qs" style="margin-top:4px">Проверка по ключевым словам. Если написал верно другими словами — жми «Засчитать».</div>`);
    setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'start'}),50);
  };
}

// разбивка текста по блокам: строка-пункт начинается с цифры, всё ниже до следующего пункта — его подпункты
function splitByPoints(text){
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean), blocks=[]; let cur=null;
  lines.forEach(l=>{ if(/^\d+\s*[.)]/.test(l)||!cur){ cur={h:l.replace(/^\d+\s*[.)]\s*/,''),body:[]}; blocks.push(cur);} else cur.body.push(l.replace(/^[а-яa-z]\s*\)\s*|^[-–•*]\s*/i,'')); });
  return blocks;
}
function examGrade(n,text,secs,auto){
  const pl=PLANS[n-1];
  const blocks=splitByPoints(text);
  const numbered=/^\s*\d+\s*[.)]/m.test(text);
  const heads=numbered?blocks.map(x=>x.h).join('\n'):text; // без нумерации ищем пункты по всему тексту
  const pm=matchItems(pl.p.map(x=>x[0]),heads||' ');
  const R=pl.p.map((x,i)=>{
    // подпункты ищем во всём тексте: могли записать не под тем номером
    const sm=x[1].length?matchItems(x[1],text||' '):[];
    return {t:x[0],ok:pm[i].ok,sub:sm.map(s=>({t:s.it,ok:s.ok}))};
  });
  const r={n,R,secs,auto,text,hint:EX.hint}; EX.res[EX.i]=r;
  drawGrade(r);
}
function scoreOf(r){
  const P=r.R.length, p=r.R.filter(x=>x.ok).length;
  const subs=r.R.flatMap(x=>x.sub), s=subs.filter(x=>x.ok).length;
  const pct=Math.max(0,Math.round(100*(subs.length? .5*p/P + .5*s/subs.length : p/P))-(r.hint?10:0));
  return {P,p,S:subs.length,s,pct,g:gradeOf(pct)};
}
function drawGrade(r){
  const b=$('#trb'), f=$('#trf'), pl=PLANS[r.n-1];
  const draw=()=>{
    const sc=scoreOf(r);
    b.innerHTML=`<div class="anim"><div class="kind">План ${r.n} · ${r.auto?'время вышло':'сдано за '+fmt(r.secs)}</div><div class="q" style="font-size:20px">${esc(pl.t)}</div>
     <div class="grade"><div class="g" style="background:${GC[sc.g]}">${sc.g}</div><div><b>${sc.pct}%</b><small>Пункты: ${sc.p} из ${sc.P}${sc.S?` · подпункты: ${sc.s} из ${sc.S}`:''}</small><small>${r.hint?'с подсказкой −10% · ':''}5 — от 85%, 4 — от 65%, 3 — от 45%</small></div></div>
     <div class="res">${r.R.map((x,i)=>`<div class="${x.ok?'ok':'bad'}"><i>${x.ok?'✓':'✗'}</i><span><b style="font-weight:600">${i+1}. ${esc(x.t)}</b></span>${x.ok?'':`<button data-p="${i}">Засчитать</button>`}</div>
       ${x.sub.length?`<div class="subl">${x.sub.map((s,j)=>`<div class="${s.ok?'ok':'bad'}"><i>${s.ok?'✓':'✗'}</i><span>${LETTERS[j]}) ${esc(s.t)}</span>${s.ok?'':`<button data-p="${i}" data-s="${j}">Засчитать</button>`}</div>`).join('')}</div>`:''}`).join('')}</div>
     <div class="sec" style="margin-left:2px">Твой ответ</div><div class="note" style="white-space:pre-wrap;font-size:15px">${esc(r.text||'— пусто —')}</div>
     <div class="qs">Проверка по ключевым словам. Если пункт написан верно, но иначе — жми «Засчитать».</div></div>`;
    b.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{ const i=+x.dataset.p; if(x.dataset.s!=null) r.R[i].sub[+x.dataset.s].ok=true; else r.R[i].ok=true; const st=b.scrollTop; draw(); b.scrollTop=st; b.firstElementChild.classList.remove('anim'); });
  };
  draw(); b.scrollTop=0;
  const last=EX.i>=EX.list.length-1;
  f.innerHTML=`<button class="big" id="nx">${last?'Итоги':'Следующий билет'}</button>`;
  buzz(10);
  $('#nx').onclick=()=>{ saveExam(r); EX.i++; if(EX.i>=EX.list.length) examSummary(); else examTask(); };
}
function saveExam(r){
  const sc=scoreOf(r); S.exam=S.exam||{};
  const prev=S.exam[r.n]; if(!prev||sc.pct>=prev.p) S.exam[r.n]={p:sc.pct,g:sc.g,ts:Date.now()};
  r.final=sc;
  // экзамен влияет на прогресс плана
  mark('p'+r.n, r.R.every(x=>x.ok));
  r.R.forEach((x,i)=>{ if(x.sub.length>=2 && G.find(g=>g.id==='p'+r.n+'.'+(i+1))) mark('p'+r.n+'.'+(i+1), x.sub.every(s=>s.ok)); });
  save();
}
function examSummary(){
  if(EX.tag) logDay(EX.tag);
  clearInterval(EXT); $('#pg').style.width='100%'; $('#tmr').textContent='';
  const rs=EX.res, avg=Math.round(rs.reduce((s,r)=>s+r.final.pct,0)/rs.length), g=gradeOf(avg);
  $('#trb').innerHTML=`<div class="done anim"><div class="em">${g===5?'🏆':g===4?'💪':g===3?'🙂':'📚'}</div><h2>Оценка: ${g}</h2><p>Средний результат ${avg}%</p></div>
   ${rs.length>1?`<div class="group">${rs.map(r=>`<div class="row nl"><div class="num" style="background:${GC[r.final.g]}">${r.final.g}</div><div class="tx"><b>${esc(PLANS[r.n-1].t)}</b><small>${r.final.pct}% · ${r.auto?'время вышло':fmt(r.secs)}</small></div></div>`).join('')}</div>`:''}
   <p class="qs" style="text-align:center;margin-top:14px">Лучшие оценки видны в списке планов.</p>`;
  const weak=rs.filter(r=>r.final.g<5).map(r=>r.n);
  $('#trf').innerHTML=`<button class="big" style="background:var(--card2);color:var(--text);box-shadow:none" onclick="endSession()">Готово</button>`+
   (weak.length?`<button class="big" id="rw">Пересдать (${weak.length})</button>`:'');
  if(weak.length) $('#rw').onclick=()=>runExam(shuffle(weak),EX.tm);
  buzz([10,40,10]);
}

/* ===================== СЕРВИС ===================== */
function toast(t){ let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; document.body.append(el);} el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2300); }
// iOS: тренажёр подстраивается под клавиатуру, кнопка «Проверить» всегда видна
if(window.visualViewport){ const vv=window.visualViewport; const fit=()=>{ const tr=$('#tr'); tr.style.height=vv.height+'px'; tr.style.top=vv.offsetTop+'px'; }; vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit); }
// клавиатура на компьютере: пробел — перевернуть, ←/→ — не знал/знал, Enter — дальше, Ctrl+Enter — сдать текст
document.addEventListener('keydown',e=>{
  if(!$('#tr').classList.contains('on')) return;
  const inTa=e.target.tagName==='TEXTAREA', c=id=>{const b=$(id); if(b){ e.preventDefault(); b.click(); return true;} };
  if(e.key==='Escape') return safeClose();
  if(inTa){ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) c('#ck')||c('#sd'); return; }
  if(e.key===' ') c('#sh');
  else if(e.key==='ArrowLeft') c('#n');
  else if(e.key==='ArrowRight') c('#y');
  else if(e.key==='Enter') c('#nx')||c('#ck')||c('#sh')||c('#sd');
});

/* ===================== СТАРТ ===================== */
renderAll();
let quick=false; try{ quick=!!sessionStorage.getItem('seen'); sessionStorage.setItem('seen',1);}catch(e){}
if(quick) $('#splash').classList.add('fast');
setTimeout(()=>{ $('#splash').classList.add('hide'); setTimeout(()=>$('#splash').remove(),500); },quick?700:1750);
</script>
