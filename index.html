<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обществознание 10 — тренажёр</title>
<style>
:root {
  --bg: #f4f6fa; --card: #ffffff; --ink: #1c2433; --muted: #5f6b7d; --line: #d9e0ea;
  --accent: #2f6db3; --accent-soft: #e6effa; --ok: #1f8a46; --ok-soft: #e3f4e9;
  --bad: #c0392b; --bad-soft: #fbe8e6; --warn-soft: #fff4dc; --shadow: 0 2px 10px rgba(20,40,80,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --card: #1b212b; --ink: #e8edf5; --muted: #9aa6b8; --line: #2c3544;
    --accent: #6ea8ff; --accent-soft: #1f2e45; --ok: #4cc27a; --ok-soft: #173325;
    --bad: #ff7b6e; --bad-soft: #3a1f1c; --warn-soft: #3a3120; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --card: #1b212b; --ink: #e8edf5; --muted: #9aa6b8; --line: #2c3544;
  --accent: #6ea8ff; --accent-soft: #1f2e45; --ok: #4cc27a; --ok-soft: #173325;
  --bad: #ff7b6e; --bad-soft: #3a1f1c; --warn-soft: #3a3120; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.45; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; }
header h1 { font-size: 22px; margin: 4px 0 2px; }
header p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.tabs button { padding: 10px 4px; font-size: 14px; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
.opt:disabled, .pool button:disabled { opacity: 1; }
.opt:disabled:not(.ok):not(.bad), .pool button:disabled:not(.ok):not(.bad):not(.miss) { color: var(--muted); }
.topics { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; margin: 0 -16px 14px; padding: 2px 16px 6px; scrollbar-width: thin; }
.topics .chip { flex: 0 0 auto; }
.chip { font-size: 13px; padding: 6px 10px; border-radius: 999px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.meta { color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.row > button { flex: 1 1 auto; }
.flash { min-height: 220px; display: flex; flex-direction: column; justify-content: center; text-align: center; cursor: pointer; user-select: none; }
.flash .q { font-size: 21px; font-weight: 650; }
.flash .a { white-space: pre-line; text-align: left; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.hint { color: var(--muted); font-size: 13px; margin-top: 12px; }
.tag { display: inline-block; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
.opt { display: block; width: 100%; text-align: left; margin: 8px 0; }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 15px; }
.qtext { font-size: 19px; font-weight: 600; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pool button { font-size: 15px; text-align: left; }
.pool button.sel { background: var(--accent-soft); border-color: var(--accent); }
.pool button.ok { background: var(--ok-soft); border-color: var(--ok); }
.pool button.bad { background: var(--bad-soft); border-color: var(--bad); }
.pool button.miss { background: var(--warn-soft); border-color: #d9a21b; border-style: dashed; }
.legend { font-size: 13px; color: var(--muted); margin-top: 10px; }
.item { font-size: 20px; font-weight: 600; text-align: center; padding: 22px 8px; border: 2px dashed var(--line); border-radius: 12px; margin: 6px 0 4px; }
.item.ok { border-color: var(--ok); background: var(--ok-soft); }
.item.bad { border-color: var(--bad); background: var(--bad-soft); }
.buckets { display: grid; gap: 8px; margin-top: 10px; }
.buckets.b2 { grid-template-columns: 1fr 1fr; }
.buckets.b3 { grid-template-columns: 1fr 1fr 1fr; }
.buckets.b4, .buckets.b5 { grid-template-columns: 1fr 1fr; }
.buckets button { padding: 14px 6px; font-weight: 600; font-size: 15px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.result h2 { margin: 0 0 6px; }
.big { font-size: 40px; font-weight: 700; color: var(--accent); }
.list { padding-left: 18px; }
.list li { margin: 6px 0; }
table.sum { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
table.sum th, table.sum td { border: 1px solid var(--line); padding: 6px; vertical-align: top; text-align: left; }
table.sum th { background: var(--accent-soft); }
select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%; }
.theme { float: right; font-size: 13px; padding: 6px 10px; }
footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
@media (max-width: 420px) { .tabs button { font-size: 12.5px; } .buckets.b3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="theme" id="themeBtn" title="Тема">◐ Тема</button>
    <h1>Обществознание · 10</h1>
    <p>Общество, прогресс, типы обществ, глобализация. ★ — дополнение, в тетради нет.</p>
  </header>

  <nav class="tabs" id="tabs">
    <button data-mode="cards" class="on">Карточки</button>
    <button data-mode="quiz">Тест</button>
    <button data-mode="collect">Собери</button>
    <button data-mode="sort">Сортировка</button>
  </nav>

  <div class="topics" id="topics"></div>
  <main id="main"></main>
  <footer>Темы сверху листаются вбок; выбор тем действует во всех режимах.</footer>
</div>

<script>
const TOPICS = [
  { id: "soc", name: "Общество" },
  { id: "sys", name: "Общество как система" },
  { id: "nat", name: "Общество и природа" },
  { id: "inst", name: "Социальные институты" },
  { id: "dev", name: "Реформа и революция" },
  { id: "prog", name: "Прогресс" },
  { id: "types", name: "Типы обществ" },
  { id: "glob", name: "Глобализация" },
  { id: "gp", name: "Глобальные проблемы" }
];

/* ---------- КАРТОЧКИ: q — вопрос/термин, a — ответ ---------- */
const CARDS = [
  { t: "soc", q: "Общество (определение)", a: "Обособившаяся от природы, но тесно с ней связанная часть материального мира, которая включает в себя формы объединения людей и способы их взаимодействия." },
  { t: "soc", q: "Общественные отношения", a: "Относительно устойчивые, во многом безличные связи, затрагивающие разные стороны общественной жизни." },
  { t: "soc", q: "4 значения понятия «общество»", a: "1) Совокупность людей с общими интересами\n2) Этап исторического развития\n3) Совокупность жителей конкретного государства\n4) Всё человечество в целом — в прошлом, настоящем и будущем" },
  { t: "soc", q: "Общность и общество: характер отношений", a: "Общность — неформальные отношения.\nОбщество — формальные отношения." },
  { t: "soc", q: "Общность и общество: что лежит в основе", a: "Общность — эмоциональная составляющая, традиции и обычаи.\nОбщество — рациональность; определяется местом человека в структуре общества." },
  { t: "soc", q: "Почему общественные отношения «безличные»?", a: "Связь существует между ролями, а не между конкретными людьми (покупатель — продавец). Сменится продавец — отношение останется." },

  { t: "sys", q: "4 сферы общества", a: "Экономическая (деньги, рынок, производство)\nПолитическая (власть, выборы, государство)\nСоциальная (семья, социальные группы)\nДуховная (религия, искусство, наука, образование)" },
  { t: "sys", q: "8 свойств общества как системы", a: "1) Сложная\n2) Динамичность\n3) Открытая система\n4) Саморегулирующаяся система\n5) Нелинейность\n6) Целостность\n7) Функциональность\n8) Устойчивость" },
  { t: "sys", q: "Открытая система — что значит?", a: "Общество взаимодействует с внешней средой: с природой и с другими обществами." },
  { t: "sys", q: "Нелинейность развития общества", a: "Развитие идёт не по прямой: бывают скачки, откаты, повороты; у разных обществ — разные пути." },
  { t: "sys", q: "Саморегулирующаяся система", a: "Общество само поддерживает порядок и равновесие — через нормы, институты, управление." },
  { t: "sys", q: "4 функции общества", a: "1) Производство материальных благ\n2) Регламентация и управление деятельностью людей\n3) Воспроизводство и социализация человека\n4) Производство духовных ценностей" },
  { t: "sys", q: "К какой сфере относится образование?", a: "К духовной: это передача знаний и ценностей (в тетради перенесено стрелкой из социальной в духовную)." },

  { t: "nat", q: "Роль природы в жизни человека (3)", a: "1) Естественная среда обитания\n2) Источник ресурсов для производственной деятельности\n3) Источник вдохновения" },
  { t: "nat", q: "Влияние природы на общество (3)", a: "1) Определяет темпы и направление общественного развития\n2) Определяет экономическую специализацию стран\n3) Определяет менталитет людей" },
  { t: "nat", q: "Положительное влияние общества на природу", a: "Заповедники и нацпарки; сортировка и утилизация мусора; экологический кодекс и наказания; расширение популяций флоры и фауны; замена ресурсов." },
  { t: "nat", q: "Отрицательное влияние общества на природу", a: "Загрязнение окружающей среды; нерациональное использование ресурсов; истребление редких видов животных и растений." },

  { t: "inst", q: "Социальный институт (определение)", a: "Исторически сложившаяся устойчивая форма организации совместной деятельности людей, направленная на выполнение общественно значимой функции." },
  { t: "inst", q: "4 признака социального института", a: "1) Направленность на удовлетворение базовых потребностей общества\n2) Содержит установки и правила поведения\n3) Наличие культурных символов и знаков\n4) Наличие системы учреждений и неформальных структур" },
  { t: "inst", q: "3 функции социальных институтов", a: "1) Социализирующая (передача социального опыта и норм из поколения в поколение)\n2) Закрепление и воспроизводство общественных отношений\n3) Регламентация поведения людей" },
  { t: "inst", q: "Примеры институтов по сферам", a: "Экон.: собственность, хозяйственные отношения, рынок\nПолит.: парламентаризм, местное самоуправление\nСоц.: семья, отцовство/материнство\nДух.: религия, искусство, образование" },
  { t: "inst", q: "Семья — институт? Докажи по признакам", a: "Потребность — продолжение рода; правила — Семейный кодекс, обычаи; символы — обручальные кольца; учреждения — ЗАГС. Все 4 признака есть." },

  { t: "dev", q: "Реформа — 4 черты", a: "Постепенные изменения; проводят властные органы; целенаправленный характер; меняется одна из сторон жизни общества." },
  { t: "dev", q: "Революция — 4 черты", a: "Резкие, кардинальные изменения; проводят народные массы; стихийный характер; меняет общество в целом." },
  { t: "dev", q: "3 формы (направления) изменений", a: "Прогресс, регресс, стагнация." },
  { t: "dev", q: "Регресс ★", a: "Движение от более совершенного к менее совершенному, упадок." },
  { t: "dev", q: "Стагнация ★", a: "Застой, отсутствие развития." },

  { t: "prog", q: "Прогресс (определение)", a: "Направление развития от простого к сложному, от менее совершенного к более совершенному." },
  { t: "prog", q: "Свойства прогресса", a: "1) Противоречивость\n2) Относительность\n3) Применим ко всему обществу и к отдельным его элементам\n4) Направленность (заложена в определении)" },
  { t: "prog", q: "Противоречивость прогресса", a: "Одно и то же явление может нести как положительные, так и отрицательные последствия. Пример: атомная энергия — АЭС и ядерное оружие." },
  { t: "prog", q: "Критерии прогресса (6)", a: "1) Уровень развития науки и технологий\n2) Степень свободы\n3) Уровень нравственности\n4) Уровень образования\n5) Степень социальной защищённости граждан\n6) Гуманизм — универсальный критерий" },
  { t: "prog", q: "Универсальный критерий прогресса", a: "Гуманизм. Он спрашивает главное: стало ли лучше человеку — его жизни, свободе, достоинству. Остальные критерии частные (наука может служить и войне)." },

  { t: "types", q: "3 типа общества", a: "Аграрное (традиционное) → индустриальное → постиндустриальное (информационное)." },
  { t: "types", q: "Основной фактор производства в каждом типе", a: "Аграрное — земля\nИндустриальное — капитал\nПостиндустриальное — информация" },
  { t: "types", q: "Политическая сфера традиционного общества", a: "Деспотическая власть; народ отстранён от власти; сакрализация власти." },
  { t: "types", q: "Политическая сфера индустриального общества", a: "Демократизация; народ включается во властные отношения; власть теряет свою сакральность." },
  { t: "types", q: "Политическая сфера постиндустриального общества", a: "Становление правового государства и гражданского общества." },
  { t: "types", q: "Социальная сфера: традиционное vs индустриальное", a: "Традиционное: сословная структура, закрытое общество, низкая социальная мобильность.\nИндустриальное: классовая структура, открытое общество, высокая мобильность, урбанизация." },
  { t: "types", q: "Духовная сфера традиционного общества", a: "Господство религии; слабое развитие науки; низкий уровень образования; большая роль традиций и обычаев." },
  { t: "types", q: "Духовная сфера индустриального общества", a: "Наука — основной институт; формируется светское сознание; растёт уровень образования; появляется массовая культура." },
  { t: "types", q: "Духовная сфера постиндустриального общества", a: "Возрастание роли науки; непрерывность образования." },
  { t: "types", q: "Натуральное vs товарное хозяйство", a: "Натуральное — производят для себя.\nТоварное — производят на продажу." },
  { t: "types", q: "Экстенсивный vs интенсивный путь", a: "Экстенсивный — рост «вширь» (больше земли, работников).\nИнтенсивный — рост «вглубь» (техника, технологии, организация)." },
  { t: "types", q: "Сакрализация власти", a: "Власть считается священной, данной Богом." },
  { t: "types", q: "Социальная мобильность", a: "Перемещение человека между социальными группами и положениями." },
  { t: "types", q: "Многовариантность развития ★", a: "Общества развиваются разными путями и с разной скоростью; единого сценария нет. Факторы: природа, история, культура и религия, личности, случайность." },
  { t: "types", q: "Формационный vs цивилизационный подход ★", a: "Формационный (Маркс): все проходят одни ступени-формации, главное — экономика.\nЦивилизационный (Данилевский, Шпенглер, Тойнби): каждая цивилизация уникальна, главное — культура." },

  { t: "glob", q: "Глобализация (определение)", a: "Процесс усиления взаимосвязи и взаимозависимости между странами и народами." },
  { t: "glob", q: "4 причины глобализации", a: "1) Развитие коммуникаций, средств связи, интернета\n2) Возможность перемещаться, транспортная инфраструктура\n3) Развитие международной торговли\n4) Объединение усилий для решения глобальных проблем" },
  { t: "glob", q: "4 формы глобализации и проявления", a: "Экономическая — мировые кризисы, ТНК\nКультурная — массовая культура, языковой обмен, мода\nПолитическая — альянсы и союзы\nСоциальная — миграция, международные организации" },
  { t: "glob", q: "Положительные последствия глобализации", a: "Обмен знаниями и технологиями; рост толерантности; снижение конфликтов; эффективнее решаются глобальные проблемы; более равномерный экономический рост; политическая стабильность." },
  { t: "glob", q: "Отрицательные последствия глобализации", a: "Усиление разрыва между богатыми и бедными странами; потеря народной уникальности; навязывание стандартов производства и потребления." },

  { t: "gp", q: "3 признака глобальных проблем", a: "1) Охватывают всё человечество в целом\n2) Угрожают жизни всего человечества\n3) Решение зависит от усилий всего человечества" },

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const topicName = id => (TOPICS.find(t => t.id === id) || {}).name || "";

let mode = "cards";
let active = new Set(TOPICS.map(t => t.id));
const inTopics = arr => arr.filter(x => active.has(x.t));

/* ---------- тема оформления ---------- */
$("#themeBtn").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

/* ---------- фильтр тем ---------- */
function renderTopics() {
  const box = $("#topics");
  const all = active.size === TOPICS.length;
  box.innerHTML = `<button class="chip ${all ? "on" : ""}" data-t="*">Все темы</button>` +
    TOPICS.map(t => `<button class="chip ${active.has(t.id) && !all ? "on" : ""}" data-t="${t.id}">${esc(t.name)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    const id = b.dataset.t;
    if (id === "*") active = new Set(TOPICS.map(t => t.id));
    else if (active.size === TOPICS.length) active = new Set([id]);
    else if (active.has(id)) { active.delete(id); if (!active.size) active = new Set(TOPICS.map(t => t.id)); }
    else active.add(id);
    renderTopics(); start();
  });
}

/* ---------- режимы ---------- */
$("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  $("#tabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  start();
});

function start() {
  ({ cards: startCards, quiz: startQuiz, collect: startCollect, sort: startSort })[mode]();
}
const empty = () => { $("#main").innerHTML = `<div class="panel">В выбранных темах нет заданий этого типа. Выбери другие темы.</div>`; };

/* ===== КАРТОЧКИ ===== */
let C = {};
function startCards() {
  const deck = shuffle(inTopics(CARDS));
  if (!deck.length) return empty();
  C = { queue: deck, known: 0, againSet: 0, total: deck.length, open: false };
  drawCard();
}
function drawCard() {
  const m = $("#main");
  if (!C.queue.length) {
    m.innerHTML = `<div class="panel result"><h2>Колода пройдена</h2>
      <p>Карточек: ${C.total}. С первого раза знал: <b>${C.total - C.againSet}</b>.</p>
      <div class="row"><button class="primary" id="re">Ещё раз</button></div></div>`;
    $("#re").onclick = startCards; return;
  }
  const c = C.queue[0];
  m.innerHTML = `
    <div class="bar"><i style="width:${Math.round(100 * C.known / C.total)}%"></i></div>
    <div class="meta"><span><span class="tag">${esc(topicName(c.t))}</span></span><span>Выучено ${C.known} из ${C.total} · в очереди ${C.queue.length}</span></div>
    <div class="panel flash" id="fc">
      <div class="q">${esc(c.q)}</div>
      ${C.open ? `<div class="a">${esc(c.a)}</div>` : `<div class="hint">Вспомни ответ вслух, потом нажми, чтобы проверить</div>`}
    </div>
    <div class="row">
      <button id="again" ${C.open ? "" : "disabled"}>↻ Повторить позже</button>
      <button id="know" class="primary" ${C.open ? "" : "disabled"}>✓ Знаю</button>
    </div>`;
  $("#fc").onclick = () => { C.open = !C.open; drawCard(); };
  $("#know").onclick = () => { C.queue.shift(); C.known++; C.open = false; drawCard(); };
  $("#again").onclick = () => {
    const x = C.queue.shift();
    if (!x._again) { x._again = true; C.againSet++; }
    const pos = Math.min(C.queue.length, 3 + Math.floor(Math.random() * 3));
    C.queue.splice(pos, 0, x); C.open = false; drawCard();
  };
}

/* ===== ТЕСТ ===== */
let Q = {};
function startQuiz() {
  const pool = shuffle(inTopics(QUIZ));
  if (!pool.length) return empty();
  const qs = pool.slice(0, Math.min(15, pool.length)).map(q => {
    const order = shuffle(q.o.map((_, i) => i));
    return { ...q, order };
  });
  Q = { qs, i: 0, score: 0, wrong: [], answered: false, pick: -1 };
  drawQuiz();
}
function drawQuiz() {
  const m = $("#main");
  if (Q.i >= Q.qs.length) {
    const pct = Math.round(100 * Q.score / Q.qs.length);
    m.innerHTML = `<div class="panel result"><h2>Результат</h2>
      <div class="big">${Q.score} / ${Q.qs.length}</div><p>${pct >= 85 ? "Отлично, тема усвоена." : pct >= 60 ? "Неплохо — повтори ошибки ниже." : "Стоит перечитать конспект и пройти ещё раз."}</p>
      ${Q.wrong.length ? `<h3>Ошибки</h3><ol class="list">${Q.wrong.map(w => `<li><b>${esc(w.q)}</b><br>Верно: ${esc(w.o[w.c])}<br><span style="color:var(--muted)">${esc(w.e)}</span></li>`).join("")}</ol>` : ""}
      <div class="row"><button class="primary" id="re">Новый тест</button></div></div>`;
    $("#re").onclick = startQuiz; return;
  }
  const q = Q.qs[Q.i];
  m.innerHTML = `
    <div class="bar"><i style="width:${Math.round(100 * Q.i / Q.qs.length)}%"></i></div>
    <div class="meta"><span><span class="tag">${esc(topicName(q.t))}</span></span><span>Вопрос ${Q.i + 1} из ${Q.qs.length} · верно ${Q.score}</span></div>
    <div class="panel">
      <div class="qtext">${esc(q.q)}</div>
      <div id="opts">${q.order.map(k => {
        let cls = "";
        if (Q.answered) { if (k === q.c) cls = "ok"; else if (k === Q.pick) cls = "bad"; }
        return `<button class="opt ${cls}" data-k="${k}" ${Q.answered ? "disabled" : ""}>${esc(q.o[k])}</button>`;
      }).join("")}</div>
      ${Q.answered ? `<div class="explain">${Q.pick === q.c ? "✓ Верно. " : "✗ Неверно. "}${esc(q.e)}</div>
      <div class="row"><button class="primary" id="next">Дальше →</button></div>` : ""}
    </div>`;
  m.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    Q.pick = +b.dataset.k; Q.answered = true;
    if (Q.pick === q.c) Q.score++; else Q.wrong.push(q);
    drawQuiz();
  });
  if (Q.answered) $("#next").onclick = () => { Q.i++; Q.answered = false; Q.pick = -1; drawQuiz(); };
}

/* ===== СОБЕРИ СПИСОК ===== */
let L = {};
function startCollect() {
  const tasks = shuffle(inTopics(COLLECT));
  if (!tasks.length) return empty();
  L = { tasks, i: 0, perfect: 0 };
  newCollect();
}
function newCollect() {
  const t = L.tasks[L.i];
  L.items = shuffle([...t.ok.map(x => ({ x, ok: true })), ...t.bad.map(x => ({ x, ok: false }))]);
  L.sel = new Set(); L.checked = false;
  drawCollect();
}
function drawCollect() {
  const m = $("#main");
  if (L.i >= L.tasks.length) {
    m.innerHTML = `<div class="panel result"><h2>Все списки пройдены</h2>
      <p>Без единой ошибки: <b>${L.perfect}</b> из ${L.tasks.length}.</p>
      <div class="row"><button class="primary" id="re">Ещё раз</button></div></div>`;
    $("#re").onclick = startCollect; return;
  }
  const t = L.tasks[L.i];
  m.innerHTML = `
    <div class="bar"><i style="width:${Math.round(100 * L.i / L.tasks.length)}%"></i></div>
    <div class="meta"><span><span class="tag">${esc(topicName(t.t))}</span></span><span>Список ${L.i + 1} из ${L.tasks.length}</span></div>
    <div class="panel">
      <div class="qtext">${esc(t.title)}</div>
      <div class="hint" style="margin-top:4px">Выбери все пункты, которые входят в список. Есть лишние.</div>
      <div class="pool">${L.items.map((it, k) => {
        let cls = L.sel.has(k) ? "sel" : "";
        if (L.checked) cls = it.ok ? (L.sel.has(k) ? "ok" : "miss") : (L.sel.has(k) ? "bad" : "");
        return `<button data-k="${k}" class="${cls}" ${L.checked ? "disabled" : ""}>${esc(it.x)}</button>`;
      }).join("")}</div>
      ${L.checked ? `<div class="legend">Зелёный — верно выбрано · красный — лишнее · жёлтый пунктир — пропущено</div>
        <div class="explain"><b>Правильный список:</b><ol class="list">${t.ok.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
        <div class="row"><button id="retry">Заново этот</button><button class="primary" id="next">Дальше →</button></div>`
      : `<div class="row"><button class="primary" id="check">Проверить (выбрано ${L.sel.size})</button></div>`}
    </div>`;
  if (!L.checked) {
    m.querySelectorAll(".pool button").forEach(b => b.onclick = () => {
      const k = +b.dataset.k; L.sel.has(k) ? L.sel.delete(k) : L.sel.add(k); drawCollect();
    });
    $("#check").onclick = () => {
      L.checked = true;
      const perfect = L.items.every((it, k) => it.ok === L.sel.has(k));
      if (perfect) L.perfect++;
      drawCollect();
    };
  } else {
    $("#retry").onclick = () => { newCollect(); };
    $("#next").onclick = () => { L.i++; if (L.i < L.tasks.length) newCollect(); else drawCollect(); };
  }
}

/* ===== СОРТИРОВКА ===== */
let S = {};
function startSort() {
  const sets = inTopics(SORT);
  if (!sets.length) return empty();
  S = { sets, set: null };
  drawSortMenu();
}
function drawSortMenu() {
  $("#main").innerHTML = `<div class="panel">
    <div class="qtext">Выбери классификацию</div>
    <div class="hint" style="margin-top:4px">Появляется по одному признаку — нажми, куда он относится.</div>
    ${S.sets.map((s, k) => `<button class="opt" data-k="${k}">${esc(s.title)} <span class="tag">${s.items.length}</span></button>`).join("")}
  </div>`;
  $("#main").querySelectorAll(".opt").forEach(b => b.onclick = () => beginSort(S.sets[+b.dataset.k]));
}
function beginSort(set) {
  S.set = set; S.items = shuffle(set.items); S.i = 0; S.score = 0; S.wrong = []; S.last = null;
  drawSort();
}
function drawSort() {
  const m = $("#main"), set = S.set, n = S.items.length;
  if (S.i >= n) {
    m.innerHTML = `<div class="panel result"><h2>${esc(set.title)}</h2>
      <div class="big">${S.score} / ${n}</div>
      ${S.wrong.length ? `<p><b>Ошибки:</b></p><ul class="list">${S.wrong.map(w => `<li>${esc(w[0])} → <b>${esc(set.b[w[1]])}</b></li>`).join("")}</ul>` : "<p>Без ошибок!</p>"}
      <table class="sum"><tr>${set.b.map(b => `<th>${esc(b)}</th>`).join("")}</tr>
      <tr>${set.b.map((_, bi) => `<td>${set.items.filter(it => it[1] === bi).map(it => esc(it[0])).join("<br>")}</td>`).join("")}</tr></table>
      <div class="row"><button id="menu">К списку классификаций</button><button class="primary" id="re">Ещё раз</button></div></div>`;
    $("#re").onclick = () => beginSort(set); $("#menu").onclick = drawSortMenu; return;
  }
  const it = S.items[S.i];
  const fb = S.last;
  m.innerHTML = `
    <div class="bar"><i style="width:${Math.round(100 * S.i / n)}%"></i></div>
    <div class="meta"><span><span class="tag">${esc(set.title)}</span></span><span>${S.i + 1} из ${n} · верно ${S.score}</span></div>
    <div class="panel">
      <div class="item ${fb ? (fb.ok ? "ok" : "bad") : ""}">${esc(it[0])}</div>
      ${fb ? `<div class="explain">${fb.ok ? "✓ Верно" : "✗ Неверно. Правильно: <b>" + esc(set.b[it[1]]) + "</b>"}</div>
        <div class="row"><button class="primary" id="next">Дальше →</button></div>`
      : `<div class="buckets b${set.b.length}">${set.b.map((b, k) => `<button data-k="${k}">${esc(b)}</button>`).join("")}</div>`}
    </div>
    <div class="row"><button id="menu">← Другая классификация</button></div>`;
  $("#menu").onclick = drawSortMenu;
  if (!fb) m.querySelectorAll(".buckets button").forEach(b => b.onclick = () => {
    const ok = +b.dataset.k === it[1];
    if (ok) S.score++; else S.wrong.push(it);
    S.last = { ok }; drawSort();
  });
  else $("#next").onclick = () => { S.i++; S.last = null; drawSort(); };
}

renderTopics();
start();
</script>
</body>
</html>
